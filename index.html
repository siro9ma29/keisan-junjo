<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算の順じょ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
    background: #fdf8ee; color: #333;
    touch-action: manipulation;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 12px; color: #2f5d8a; }
  .card { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  .rules { display: flex; flex-wrap: wrap; gap: 8px; font-size: 16px; }
  .rules span { background: #eef5ff; border-radius: 10px; padding: 6px 10px; }
  .rules b { color: #2f5d8a; }

  .levels { display: flex; flex-wrap: wrap; gap: 8px; }
  .levels button {
    font: inherit; font-size: 18px; font-weight: bold; padding: 10px 16px;
    border-radius: 12px; border: 3px solid #c9d6e6; background: #fff; color: #2f5d8a; cursor: pointer;
  }
  .levels button.cur { background: #2f5d8a; border-color: #2f5d8a; color: #fff; }
  .levels button .star { color: #f2a900; margin-left: 4px; }
  .levels button.teacher { font-size: 15px; color: #666; }
  .levels button.teacher.cur { background: #666; border-color: #666; color: #fff; }
  .modes { display: flex; gap: 0; margin-bottom: 10px; }
  .modes button {
    font: inherit; font-size: 17px; font-weight: bold; padding: 8px 18px; cursor: pointer;
    border: 3px solid #2a9d55; background: #fff; color: #2a9d55;
  }
  .modes button:first-child { border-radius: 12px 0 0 12px; }
  .modes button:last-child { border-radius: 0 12px 12px 0; }
  .modes button:not(:first-child) { border-left: none; }
  .modes button.cur { background: #2a9d55; color: #fff; }
  @media (max-width: 560px) {
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .modes button, .modes button:first-child, .modes button:last-child { font-size: 14px; padding: 8px 2px; white-space: nowrap; border-radius: 10px; border-left: 3px solid #2a9d55; }
  }
  #lvdesc { margin: 10px 0 0; font-size: 17px; color: #444; }
  #lvdesc .tag { display: inline-block; background: #fff2cc; border-radius: 8px; padding: 2px 10px; margin: 2px 4px 2px 0; }

  #prog, #kprog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  #prog i, #kprog i { width: 16px; height: 16px; border-radius: 50%; background: #e3e8ef; display: inline-block; }
  #prog i.ok, #kprog i.ok { background: #2a9d55; }
  #prog i.now, #kprog i.now { background: #2f5d8a; box-shadow: 0 0 0 3px #bcd3ea; }
  .qno { text-align: center; color: #888; font-size: 15px; margin: 0 0 4px; }

  .guide { text-align: center; font-size: 17px; margin: 0 0 6px; }
  .key { display: inline-block; background: #eef5ff; border-radius: 6px; padding: 0 6px; margin: 0 2px; font-weight: bold; }

  #expr {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    min-height: 110px; padding: 12px 0;
    font-size: clamp(30px, 7vw, 56px); font-weight: bold; font-variant-numeric: tabular-nums;
  }
  #expr span { padding: 4px 2px; border-radius: 10px; transition: background .2s; }
  #expr .par { color: #7a5bb5; }
  #expr .fresh { color: #d6336c; }
  #expr .hl { background: #ffe066; }
  #expr .op {
    font: inherit; font-size: 1em; font-weight: bold; color: #2f5d8a;
    background: #eef5ff; border: 3px solid #bcd3ea; border-radius: 14px;
    min-width: 1.4em; margin: 0 6px; padding: 0 6px; cursor: pointer; line-height: 1.3;
  }
  #expr .op:active { transform: scale(.94); }
  #expr .op.hl { background: #ffe066; border-color: #f2a900; }
  #expr .op.hint { animation: glow 1s infinite; border-color: #f08c00; }
  #expr .op.ng { background: #ffd6d6; border-color: #e03131; color: #b03030; animation: shake .4s; }

  #expr .inum { color: #2f5d8a; }
  .grp { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; justify-content: center; max-width: 380px; }
  .box { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; border: 2px dashed #adb5bd; border-radius: 10px; padding: 3px; }
  #msg, #kmsg { min-height: 52px; text-align: center; font-size: 20px; border-radius: 12px; padding: 12px; }
  #msg.ok, #kmsg.ok     { background: #e6f7ec; color: #1f7a43; }
  #msg.bad, #kmsg.bad   { background: #ffeaea; color: #b03030; }
  #msg.info, #kmsg.info { background: #fff6e0; color: #8a5a00; }
  #msg.done, #kmsg.done { background: #ffe9f1; color: #c2255c; font-weight: bold; font-size: 24px; }
  #kmsg small { font-size: 16px; color: #666; font-weight: normal; }

  .result { text-align: center; padding: 10px 0; }
  .result .big { font-size: 34px; font-weight: bold; color: #d6336c; margin: 6px 0; }
  .result p { font-size: 20px; margin: 6px 0; }

  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .btn {
    font: inherit; font-size: 18px; font-weight: bold; padding: 10px 20px;
    border-radius: 12px; border: none; cursor: pointer; color: #fff;
  }
  .btn.hintb { background: #f08c00; }
  .btn.reset { background: #868e96; }
  .btn.next  { background: #2f5d8a; }
  .btn.next.big { background: #d6336c; font-size: 22px; padding: 12px 28px; animation: pulse 1.2s infinite; }
  .btn.again { background: #2a9d55; }

  #log { font-size: clamp(18px, 3.4vw, 26px); line-height: 1.8; font-variant-numeric: tabular-nums; }
  #log .line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  #log .eq { width: 1.2em; color: #888; }
  #log .empty { color: #aaa; font-size: 16px; }

  .ttl { font-size: 15px; color: #888; margin: 0 0 6px; }

  details summary { cursor: pointer; color: #666; font-size: 15px; }
  .add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .add input { flex: 1; min-width: 200px; font-size: 18px; padding: 8px 10px; border-radius: 10px; border: 2px solid #c9d6e6; }
  .add button { font-size: 16px; padding: 8px 14px; border-radius: 10px; border: none; background: #2f5d8a; color: #fff; cursor: pointer; }
  .add button.sub { background: #adb5bd; }
  #addMsg { font-size: 15px; margin-top: 6px; min-height: 1.2em; }
  #customList { font-size: 15px; color: #555; margin-top: 6px; }
  .small { font-size: 14px; color: #777; }

  /* ---- 計算モード（筆算） ---- */
  #calc { margin: 8px auto 0; max-width: 640px; border: 3px solid #f2a900; border-radius: 16px; background: #fffdf5; padding: 12px 12px 14px; }
  .ctop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .ctitle { font-size: 24px; font-weight: bold; color: #333; font-variant-numeric: tabular-nums; }
  .cbtn { font: inherit; font-size: 15px; font-weight: bold; padding: 6px 12px; border-radius: 10px; border: 2px solid #868e96; background: #fff; color: #555; cursor: pointer; }
  .cnote { font-size: 15px; color: #666; margin: 6px 0 0; }
  .phase { display: flex; justify-content: center; gap: 4px; margin: 10px 0 0; flex-wrap: wrap; }
  .phase span { font-size: 16px; padding: 3px 10px; border-radius: 10px; background: #f1f3f5; color: #999; }
  .phase span.cur { background: #2f5d8a; color: #fff; font-weight: bold; }
  .hs { --cw: clamp(38px, 10vw, 54px); display: grid; justify-content: center; margin: 12px auto 6px;
        font-size: calc(var(--cw) * .7); font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; }
  .hs .hc, .hs .hl { height: calc(var(--cw) * 1.08); display: flex; align-items: center; justify-content: center; position: relative; }
  .hs .hl { justify-content: flex-end; padding-right: 6px; color: #2f5d8a; min-width: 1.1em; }
  .hs .m { height: calc(var(--cw) * .58); font-size: .52em; color: #e8590c; align-items: flex-end; padding-bottom: 2px; }
  .hs .ln { border-bottom: 3px solid #333; }
  .hs .hc.bar { border-top: 3px solid #333; }
  .hs .divlab { padding-right: 0; color: #333; }
  .hs .divlab .brk { font-size: 1.25em; transform: scaleY(1.25); margin: 0 0 0 2px; font-weight: normal; }
  .hs .hc.focus { background: #e7f1ff; }
  .hs .hc.in { color: #2f5d8a; }
  .hs .hc.down { color: #1c7ed6; }
  .hs .hc.down::after { content: "↓"; position: absolute; top: -2px; right: 2px; font-size: .38em; color: #1c7ed6; }
  .hs .hc.zero { color: #c3c9cf; }
  .hs .hc.cur { background: #fff3bf; border-radius: 8px; box-shadow: inset 0 0 0 3px #f08c00; animation: glow 1s infinite; }
  .hs .hc.m.cur { box-shadow: inset 0 0 0 2px #f08c00; }
  .hs .hc.ng { background: #ffd6d6; box-shadow: inset 0 0 0 3px #e03131; animation: shake .4s; }
  .hs .hc.strike { color: #9aa1a8; background: linear-gradient(to top right, transparent calc(50% - 2px), #e03131 calc(50% - 1px), #e03131 calc(50% + 1px), transparent calc(50% + 2px)); }
  .hs .hc.tap { cursor: pointer; border-radius: 8px; box-shadow: inset 0 0 0 2px #bcd3ea; }
  .hs .hc.tap:active { transform: scale(.94); }
  .hs .hc.hintc { box-shadow: inset 0 0 0 3px #f08c00; animation: glow 1s infinite; }
  .anz { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 14px 0 6px; font-size: clamp(28px, 6vw, 40px); font-weight: bold; }
  .anz .box { min-width: 4.2em; height: 1.5em; border: 3px solid #f08c00; border-radius: 12px; background: #fff3bf; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font-variant-numeric: tabular-nums; color: #2f5d8a; }
  #cmsg { min-height: 44px; text-align: center; font-size: 19px; border-radius: 12px; padding: 10px; margin-top: 6px; }
  #cmsg.ok { background: #e6f7ec; color: #1f7a43; font-weight: bold; }
  #cmsg.bad { background: #ffeaea; color: #b03030; }
  #cmsg.info { background: #fff6e0; color: #8a5a00; }
  .ckeys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 440px; margin: 10px auto 0; }
  .ckeys button { font: inherit; font-size: 28px; font-weight: bold; padding: 8px 0; border-radius: 12px; border: 3px solid #c9d6e6; background: #fff; color: #333; cursor: pointer; }
  .ckeys button:active { transform: scale(.94); background: #eef5ff; }
  .ckeys button.wide { grid-column: span 2; font-size: 20px; }
  .ckeys button.okb { background: #2a9d55; border-color: #2a9d55; color: #fff; }
  .cfoot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .teinei { font-size: 16px; color: #555; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .teinei input { width: 20px; height: 20px; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(240,140,0,.6)} 50%{box-shadow:0 0 0 8px rgba(240,140,0,0)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>計算の順じょ マスター</h1>

  <div class="card">
    <div class="rules">
      <span><b>①</b> （ ）の中を先に</span>
      <span><b>②</b> ×・÷ を ＋・− より先に</span>
      <span><b>③</b> あとは 左から順に</span>
    </div>
  </div>

  <div class="card">
    <div class="modes" id="modes"></div>
    <p class="ttl">レベルをえらぶ</p>
    <div class="levels" id="levels"></div>
    <div id="lvdesc"></div>
  </div>

  <div class="card">
    <div id="prog"></div>
    <p class="qno" id="qno"></p>
    <p class="guide" id="guide">はじめに計算する（作る）ところの 記号 <span class="key">＋</span><span class="key">−</span><span class="key">×</span><span class="key">÷</span> をタップしよう。</p>
    <div id="expr"></div>
    <div id="msg"></div>
    <div id="calc" style="display:none"></div>
    <div class="btns" id="btns"></div>
  </div>

  <div class="card">
    <p class="ttl">計算のあしあと</p>
    <div id="log"></div>
  </div>

  <div class="card">
    <details>
      <summary>先生用：問題を追加する（「先生の問題」に入ります）</summary>
      <div class="add">
        <input id="addInput" placeholder="例）300-120÷4　（全角・半角どちらでもOK）">
        <button id="addBtn">追加</button>
        <button class="sub" id="clearCustom">追加した問題をすべて消す</button>
      </div>
      <div id="addMsg"></div>
      <div id="customList"></div>
      <p class="small">使える記号：＋ − × ÷ （ ）。わり切れない÷や、とちゅうや答えがマイナスになる式は追加できません。追加した問題はこの端末のブラウザに保存されます。</p>
    </details>
  </div>
</div>

<script>
/* ================= 設定 ================= */
const PER = 10; // 1レベルの問題数
const LEVELS = [
  { id: 1, name: "レベル1", tags: ["＋ − だけ", "（ ）あり・なし 半分ずつ", "記号は2つ"], ops: "+-",   n: 2, paren: 1,   needMD: false, needAS: false, boring: 0, mixParen: true },
  { id: 2, name: "レベル2", tags: ["＋ − × ÷", "（ ）が1組", "記号は2つ"], ops: "+-*/", n: 2, paren: 1,   needMD: true,  needAS: false, boring: 0, meaningful: 0.5 },
  { id: 3, name: "レベル3", tags: ["＋ − × ÷", "（ ）なし",   "記号は2つ"], ops: "+-*/", n: 2, paren: 0,   needMD: true,  needAS: true,  boring: 0.15 },
  { id: 4, name: "レベル4", tags: ["＋ − × ÷", "（ ）あり・なし", "記号は3つ"], ops: "+-*/", n: 3, paren: 0.5, needMD: true,  needAS: false, boring: 0.15 },
  // 計算モード：順じょをえらんだあと、自分で計算する（筆算つき）。数のはんいは数字モードと同じ
  { id: 13, name: "計算1", mode: "calc", per: 6, tags: ["＋ − だけ", "（ ）あり・なし", "記号は2つ", "筆算で計算"], ops: "+-",   n: 2, paren: 1,   needMD: false, needAS: false, boring: 0, mixParen: true, base: 1 },
  { id: 14, name: "計算2", mode: "calc", per: 6, tags: ["＋ − × ÷", "（ ）が1組", "記号は2つ", "筆算で計算"], ops: "+-*/", n: 2, paren: 1,   needMD: true,  needAS: false, boring: 0, meaningful: 0.5 },
  { id: 15, name: "計算3", mode: "calc", per: 6, tags: ["＋ − × ÷", "（ ）なし",   "記号は2つ", "筆算で計算"], ops: "+-*/", n: 2, paren: 0,   needMD: true,  needAS: true,  boring: 0.15 },
  { id: 16, name: "計算4", mode: "calc", per: 4, tags: ["＋ − × ÷", "（ ）あり・なし", "記号は3つ", "筆算で計算"], ops: "+-*/", n: 3, paren: 0.5, needMD: true,  needAS: false, boring: 0.15 }
];
LEVELS.forEach(L => { if (!L.mode) L.mode = "num"; });
const SYM = { "+": "＋", "-": "−", "*": "×", "/": "÷" };
const isMD = v => v === "*" || v === "/";

/* ================= 保存（使えない環境でも動く） ================= */
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let custom = load("junjo_custom", []);
let best = load("junjo_best", {});
let lv = 1, set = [], qi = 0, tokens = [], lines = [], mistakes = 0, totalMiss = 0;
let busy = false, done = false, finished = false, solved = [];
let mode = "num", stepNo = 0;
let cx = null, calcMiss = 0, totalCalcMiss = 0, calcSeq = 0, calcLock = false;
let teinei = load("junjo_teinei", true); // くり上がり・くり下がりも自分で書く
const curL = () => LEVELS.find(L => L.id === lv);
const isCalc = () => mode === "calc";

/* ================= 式の読み取り ================= */
function normalize(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/＋/g, "+").replace(/[－−ー‐―‑]/g, "-")
    .replace(/[×xX＊]/g, "*").replace(/[÷／]/g, "/")
    .replace(/（/g, "(").replace(/）/g, ")")
    .replace(/[\s　,，]/g, "");
}
function tokenize(str) {
  const s = normalize(str), out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\d/.test(c)) { let j = i; while (j < s.length && /\d/.test(s[j])) j++; out.push({ t: "num", v: Number(s.slice(i, j)) }); i = j; }
    else if ("+-*/".includes(c)) { out.push({ t: "op", v: c }); i++; }
    else if (c === "(" || c === ")") { out.push({ t: c }); i++; }
    else return null;
  }
  return out;
}
function toStr(t) {
  return t.map(x => x.t === "num" ? (typeof x.v === "object" ? x.v.label : String(x.v)) : x.t === "op" ? SYM[x.v] : (x.t === "(" ? "（" : "）")).join("");
}
function toAscii(t) {
  return t.map(x => x.t === "num" ? String(x.v) : x.t === "op" ? x.v : x.t).join("");
}
function stripLoneParens(t) {
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i + 2 < t.length; i++) {
      if (t[i].t === "(" && t[i + 1].t === "num" && t[i + 2].t === ")") {
        t = t.slice(0, i).concat([t[i + 1]], t.slice(i + 3)); changed = true; break;
      }
    }
  }
  if (t.length >= 2 && t[0].t === "(" && t[t.length - 1].t === ")") {
    // 式全体をかこむ（ ）は外す（中で閉じていない場合のみ）
    let d = 0, whole = true;
    for (let i = 0; i < t.length; i++) { if (t[i].t === "(") d++; if (t[i].t === ")") d--; if (d === 0 && i < t.length - 1) { whole = false; break; } }
    if (whole) return stripLoneParens(t.slice(1, -1));
  }
  return t;
}

/* ================= 計算の順じょのきまり ================= */
// いちばん内側の（ ）の中。（ ）がなければ式全体
function regions(t) {
  const r = []; let open = -1;
  for (let i = 0; i < t.length; i++) {
    if (t[i].t === "(") open = i;
    else if (t[i].t === ")") { if (open >= 0) r.push([open + 1, i]); open = -1; }
  }
  return r.length ? { list: r, paren: true } : { list: [[0, t.length]], paren: false };
}
function validInRegion(t, s, e) {
  const ops = [];
  for (let i = s; i < e; i++) if (t[i].t === "op") ops.push(i);
  if (!ops.length) return [];
  if (ops.some(i => isMD(t[i].v))) {
    // ×÷のまとまりごとに、いちばん左の×÷
    return ops.filter(i => isMD(t[i].v) && !(i - 2 >= s && t[i - 2].t === "op" && isMD(t[i - 2].v)));
  }
  return [ops[0]];
}
function validOps(t) {
  const R = regions(t); let v = [];
  for (const [s, e] of R.list) v = v.concat(validInRegion(t, s, e));
  return v;
}
function checkStep(t, k) {
  if (validOps(t).includes(k)) return { ok: true };
  const R = regions(t);
  const reg = R.list.find(([s, e]) => k >= s && k < e);
  if (R.paren && !reg) return { ok: false, rule: 1, msg: "（ ）の中を先に計算しよう。" };
  const [s, e] = reg;
  let hasMD = false;
  for (let i = s; i < e; i++) if (t[i].t === "op" && isMD(t[i].v)) hasMD = true;
  if (hasMD && !isMD(t[k].v)) return { ok: false, rule: 2, msg: "×や÷は、＋や−より先に計算しよう。" };
  return { ok: false, rule: 3, msg: "同じなかまの記号は、左から順に計算しよう。" };
}
function calc(a, op, b) {
  if (op === "+") return a + b;
  if (op === "-") return a - b;
  if (op === "*") return a * b;
  if (op === "/") return (b !== 0 && a % b === 0) ? a / b : null;
}
function applyStep(t, k) {
  const a = t[k - 1].v, b = t[k + 1].v, r = calc(a, t[k].v, b);
  const plain = x => { const c = Object.assign({}, x); delete c.fresh; return c; };
  const nt = stripLoneParens(t.slice(0, k - 1).map(plain).concat([{ t: "num", v: r, fresh: true }], t.slice(k + 2).map(plain)));
  return { tokens: nt, a, b, r };
}

/* ================= 問題をつくる ================= */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function bigNum(L) {
  const x = Math.random();
  if (L.id === 1 || L.base === 1) {

function newSet() {

  else {
    const L = curL(), seen = new Set(); set = [];

      // （ ）ありとなしを半分ずつ作って、順番をまぜる
      for (const withP of [true, false]) {
        const goal = set.length + (withP ? Math.ceil(per / 2) : Math.floor(per / 2));
        for (let g = 0; set.length < goal && g < 200; g++) {
          const p = generate(L, withP);
          if (p && !seen.has(p)) { seen.add(p); set.push(p); }
        }
      }
      for (let i = set.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [set[i], set[j]] = [set[j], set[i]]; }
    } else {
      for (let g = 0; set.length < per && g < 200; g++) {
        const p = generate(L);
        if (p && !seen.has(p)) { seen.add(p); set.push(p); }
      }
    }
  }
  solved = set.map(() => false);
  renderLevels();
  startQ();
}

  mistakes = 0; done = false; busy = false;
  calcMiss = 0; cx = null; calcSeq++; calcLock = false; renderCalc();
  if (!set.length) {

    $("expr").innerHTML = ""; setMsg("", ""); $("prog").innerHTML = ""; $("qno").textContent = "";
    $("btns").innerHTML = ""; renderLog(); return;

  const res = checkStep(tokens, k);

    const e = opEl(k); void e.offsetWidth; e.classList.add("ng");
    setMsg("bad", res.msg);
    return;
  }
  busy = true;
  [k - 1, k, k + 1].forEach(i => opEl(i).classList.add("hl"));
  if (isCalc()) { startCalc(k); return; } // 計算モード：自分で計算する

  busy = false;
  if (tokens.length === 1) {

  if (busy || done) return;
  const v = validOps(tokens);
  if (!v.length) return;
  $("expr").querySelectorAll(".op").forEach(e => e.classList.remove("ng", "hint"));
  v.forEach(k => opEl(k).classList.add("hint"));
  const R = regions(tokens);
  let why = "左から順に計算します。";
  if (R.paren) why = "（ ）の中を先に計算します。";
  else if (v.some(k => isMD(tokens[k].v)) && tokens.some(x => x.t === "op" && !isMD(x.v))) why = "×・÷を、＋・−より先に計算します。";

  if (calcLock) return;
  if (qi < set.length - 1) { qi++; startQ(); }
  else {
    cx = null; calcSeq++; busy = false; renderCalc();
    finished = true;

/* ================= 計算モード（筆算） ================= */
// 位はすべて「一の位＝0、十の位＝1…」の番号であつかう
const digs = n => String(n).split("").map(Number);

  let top = a, bot = b, sw = false;
  if (lb > la || (la === lb && b % 10 === 0 && a % 10 !== 0)) { top = b; bot = a; sw = true; }
  if (String(bot).length > 2 || String(top).length > 3) return null;
  if (bot >= 10 && bot % 10 === 0) return null;
  return { top, bot, sw };
}

  if (op === "*") return !!mulLayout(a, b);

function calcOK(t) {
  t = t.map(x => Object.assign({}, x));

    if (!hissanOK(a, op, b)) return false;

// 九九ですぐ出せる計算は、はじめは「あんざん」で答える
const isEasy = (a, op, b) => op === "*" ? (a < 10 && b < 10) : op === "/" ? (b < 10 && a / b < 10) : false;

/* ---- たし算 ---- */
function hsAdd(a, b) {
  const A = digs(a), B = digs(b), S = digs(a + b), W = S.length;
  const cin = [0];
  for (let p = 0; p < W; p++) cin[p + 1] = ((atP(A, p) || 0) + (atP(B, p) || 0) + cin[p]) >= 10 ? 1 : 0;
  const colSum = p => (atP(A, p) || 0) + (atP(B, p) || 0) + cin[p];
  const tasks = [];
  for (let p = 0; p < W; p++) {
    if (teinei && cin[p]) tasks.push({ t: "carry", p, v: 1 });
    tasks.push({ t: "ans", p, v: atP(S, p) });
  }
  const ans = {}, carry = {};
  let ti = 0;
  const H = {
    task: () => tasks[ti], sid: () => ti, teineiUsed: true,
    grid() {
      const tk = tasks[ti], fp = tk ? tk.p : -1;
      const f = p => p === fp ? "focus" : "";
      return { W, rows: [
        { memo: true, cells: rowOf(W, p => ({ v: carry[p] ? "1" : "", cls: tk && tk.t === "carry" && tk.p === p ? "cur" : "" })) },
        { cells: rowOf(W, p => ({ v: atP(A, p), cls: f(p) })) },
        { lab: "＋", line: true, cells: rowOf(W, p => ({ v: atP(B, p), cls: f(p) })) },
        { cells: rowOf(W, p => ({ v: ans[p], cls: tk && tk.t === "ans" && tk.p === p ? "cur" : (ans[p] !== undefined ? "in" : f(p)) })) }
      ] };
    },
    input(d) {
      const tk = tasks[ti];
      if (d !== tk.v) {
        if (tk.t === "carry") return { ok: false, msg: "くり上がりは 1 だよ。小さく 1 を書こう。" };
        if (cin[tk.p] && d === (tk.v + 9) % 10) return { ok: false, msg: `${pn(tk.p - 1)}から くり上がった 1 を、たしわすれていないかな？` };
        return { ok: false, msg: `${pn(tk.p)}を もう一度 計算してみよう。` };
      }
      let msg = "";
      if (tk.t === "carry") carry[tk.p] = 1;
      else {
        ans[tk.p] = d;
        if (cin[tk.p + 1]) {
          if (teinei) msg = `10 をこえたね。${pn(tk.p + 1)}の上に、くり上がりの 1 を書こう。`;
          else { carry[tk.p + 1] = 1; msg = `10 をこえたので、${pn(tk.p + 1)}に 1 くり上げたよ。`; }
        }

    hint() {
      const tk = tasks[ti], p = tk.p;
      if (tk.t === "carry") return `${pn(p - 1)}は ${colSum(p - 1)} で、10 をこえたね。${pn(p)}の上に 小さく 1 を書こう。`;
      const xs = [atP(A, p), atP(B, p)].filter(x => x !== null), s = colSum(p);
      if (!xs.length) return `くり上がりの 1 を、そのまま ${pn(p)}に書こう。`;
      if (xs.length === 1 && !cin[p]) return `${pn(p)}は たす数がないので、${s} をそのまま書こう。`;
      return `${pn(p)}：${xs.join("＋")}${cin[p] ? "＋1（くり上がり）" : ""}＝${s}。` + (s >= 10 ? `答えには ${s % 10} を書くよ。` : `${s} を書こう。`);

        { lab: "−", line: true, cells: rowOf(W, q => ({ v: atP(B, q), cls: f(q) })) },
        { cells: rowOf(W, q => ({ v: ans[q], cls: tk && tk.t === "ans" && tk.p === q ? "cur" : (ans[q] !== undefined ? "in" : f(q)) })) }

      const q = lender();
      if (x < q) return { ok: false, msg: `${pn(x)}は 0 なので、かせないよ。もっと左の位から かりてこよう。` };
      if (x > q) return { ok: false, msg: "もっと近くの位から かりよう。" };

        return { ok: false, msg: `${cur[p]} から ${bot(p)} はひけないね。左の位から 10 かりよう（上の数字をタップ）。` };
      }
      if (d !== tk.v) {
        if (need() && d === bot(p) - cur[p]) return { ok: false, msg: `下から上を ひいていないかな？ ${cur[p]} から ${bot(p)} はひけないので、左の位から 10 かりて計算するよ。` };
        if (lent[p] && d === tk.v + 1) return { ok: false, msg: recv[p] ? `${pn(p)}は 10 になってから となりに 1 かしたので、9 になっているよ。` : `${pn(p)}は となりに 1 かしたので、${orig(p)} ではなく ${cur[p]} になっているよ。` };

      }
      let msg = "";
      if (need()) { // ていねいOFFのとき：かりる手順は自動で書く
        const q = lender(); for (let x = q; x > p; x--) transfer(x);
        msg = "左の位から 10 かりたよ。";
      }
      ans[p] = d; p++; acts++; H.hintOn = false;
      return { ok: true, msg, done: p >= RL };
    },
    hint() {
      const tk = task();
      if (tk.t === "borrow") {
        const q = lender();
        H.hintOn = true;
        return `${cur[p]} から ${bot(p)} はひけないね。` + (q === p + 1 ? `${pn(q)}の数字をタップして、10 かりよう。` : `${pn(p + 1)}は 0 なので、まず ${pn(q)}の数字をタップしよう。`);
      }
      const c = cur[p] + (need() ? 10 : 0), bt = bot(p);
      if (atP(B, p) === null) return `${pn(p)}は ひく数がないので、${c} をそのまま書こう。` + (lent[p] ? `（1 かしたので ${c} になっているよ）` : "");
      if (c >= 10 && bt > 0) return `${pn(p)}：${c}−${bt}。10−${bt}＝${10 - bt}、${10 - bt}＋${c - 10}＝${c - bt}。`;
      return `${pn(p)}：${c}−${bt}＝${c - bt}。` + (lent[p] ? `（1 かしたので ${c} になっているよ）` : "");
    }
  };
  return H;
}

/* ---- かけ算 ---- */
function hsMul(a, b) {
  const L = mulLayout(a, b), T = digs(L.top), M = digs(L.bot), two = M.length === 2;
  const m1 = M[M.length - 1], m10 = two ? M[0] : 0, F = L.top * L.bot, FD = digs(F);
  const W = Math.max(T.length, M.length, FD.length);
  const tasks = [];
  function rowTasks(t, mul, shift) {
    const ds = digs(L.top * mul);
    let cin = 0;
    for (let q = 0; q < ds.length; q++) {
      const td = atP(T, q), pr = td === null ? cin : td * mul + cin;
      tasks.push({ t, p: q + shift, tp: q, v: atP(ds, q), td, mul, cin, pr });
      cin = td === null ? 0 : Math.floor(pr / 10);
    }
  }
  rowTasks("p1", m1, 0);
  if (two) {
    rowTasks("p2", m10, 1);
    const A1 = digs(L.top * m1), A2 = digs(L.top * m10);
    let cin = 0;
    for (let q = 0; q < FD.length; q++) {
      const x = atP(A1, q), y = atP(A2, q - 1), s = (x || 0) + (y || 0) + cin;
      tasks.push({ t: "sum", p: q, v: atP(FD, q), x, y, cin, s });
      cin = s >= 10 ? 1 : 0;
    }
  }
  const store = { p1: {}, p2: {}, sum: {} };
  let memo = {}, ti = 0;
  const H = {
    task: () => tasks[ti], sid: () => ti, swapped: L.sw, top: L.top, bot: L.bot,
    grid() {
      const tk = tasks[ti];
      const tdP = tk && tk.t !== "sum" && tk.td !== null ? tk.tp : -1;
      const mP = tk ? (tk.t === "p1" ? 0 : tk.t === "p2" ? 1 : -1) : -1;
      const sumP = tk && tk.t === "sum" ? tk.p : -1;
      const cell = name => q => {
        const v = store[name][q], isCur = tk && tk.t === name && tk.p === q;
        return { v, cls: isCur ? "cur" : (name !== "sum" && q === sumP ? "focus" : (v !== undefined ? "in" : "")) };
      };
      const rows = [
        { memo: true, cells: rowOf(W, q => ({ v: memo[q] })) },
        { cells: rowOf(W, q => ({ v: atP(T, q), cls: q === tdP ? "focus" : "" })) },
        { lab: "×", line: true, cells: rowOf(W, q => ({ v: atP(M, q), cls: q === mP ? "focus" : "" })) },
        { cells: rowOf(W, cell("p1")) }
      ];
      if (two) rows.push({ line: true, cells: rowOf(W, cell("p2")) }, { cells: rowOf(W, cell("sum")) });
      return { W, rows };
    },
    input(d) {
      const tk = tasks[ti];
      if (d !== tk.v) {
        if (tk.t !== "sum" && tk.td !== null && tk.cin && d === (tk.td * tk.mul) % 10) return { ok: false, msg: `くり上がりの ${tk.cin} を たしわすれていないかな？` };
        if (tk.t === "sum" && tk.cin && d === (tk.v + 9) % 10) return { ok: false, msg: "くり上がりの 1 を たしわすれていないかな？" };
        return { ok: false, msg: "もう一度 計算してみよう。" };
      }
      store[tk.t][tk.p] = d;
      if (tk.t !== "sum" && tk.td !== null && tk.pr >= 10) memo[tk.tp + 1] = Math.floor(tk.pr / 10);
      ti++;
      let msg = "";
      const nx = tasks[ti];
      if (nx && nx.t !== tk.t) {
        memo = {};
        msg = nx.t === "p2" ? `つぎは 十の位の ${m10} をかけるよ。1つ左に ずらして書こう。` : "さいごに、たし算をしよう。";
      }
      return { ok: true, msg, done: ti >= tasks.length };
    },
    hint() {
      const tk = tasks[ti];
      if (tk.t === "sum") {
        const xs = [tk.x, tk.y].filter(x => x !== null);
        if (xs.length === 1 && !tk.cin) return `${pn(tk.p)}は ${xs[0]} をそのまま書こう。`;
        if (!xs.length) return `くり上がりの 1 を そのまま書こう。`;
        return `${pn(tk.p)}：${xs.join("＋")}${tk.cin ? "＋1（くり上がり）" : ""}＝${tk.s}。` + (tk.s >= 10 ? `答えには ${tk.s % 10} を書くよ。` : "");
      }
      const head = tk.t === "p2" && tk.tp === 0 ? `十の位の ${m10} をかけるので、答えは ${pn(1)}から書くよ。` : "";
      if (tk.td === null) return head + `くり上がりの ${tk.cin} を そのまま書こう。`;
      return head + `${tk.td}×${tk.mul}＝${tk.td * tk.mul}` + (tk.cin ? `、くり上がりの ${tk.cin} をたして ${tk.pr}` : "") +
        `。` + (tk.pr >= 10 ? `${tk.pr % 10} を書いて、${Math.floor(tk.pr / 10)} は くり上がり。` : "");
    }
  };
  return H;
}

/* ---- わり算（たてる → かける → ひく → おろす） ---- */
function hsDiv(a, b) {
  const D = digs(a), n = D.length;
  let i0 = 0, cv = D[0];
  while (cv < b && i0 < n - 1) { i0++; cv = cv * 10 + D[i0]; }
  const tasks = [];
  let wr = 0, curRow = -1, rem = 0;
  for (let i = i0; i < n; i++) {
    if (i > i0) { cv = rem * 10 + D[i]; tasks.push({ t: "down", row: curRow, col: i, v: D[i] }); }
    const q = Math.floor(cv / b);
    tasks.push({ t: "q", col: i, v: q, cur: cv, row: curRow, first: i === i0 });
    if (q > 0) {
      const pr = q * b, df = cv - pr, pRow = wr++, dRow = wr++, pd = digs(pr);
      pd.forEach((v, j) => tasks.push({ t: "prod", row: pRow, col: i - (pd.length - 1 - j), v, q, cur: cv, pr }));
      if (df > 0 || i === n - 1) {
        const dd = digs(df);
        dd.forEach((v, j) => tasks.push({ t: "diff", row: dRow, col: i - (dd.length - 1 - j), v, cur: cv, pr }));
      } else tasks.push({ t: "diff0", row: dRow, col: i, v: 0, cur: cv, pr });
      curRow = dRow; rem = df;
    } else rem = cv;
  }
  const qd = {}, work = {};
  let ti = 0;
  const H = {
    task: () => tasks[ti], sid: () => ti,
    phase() { const tk = tasks[ti]; return tk ? { q: 0, prod: 1, diff: 2, diff0: 2, down: 3 }[tk.t] : -1; },
    grid() {
      const tk = tasks[ti];
      const fc = tk && tk.t === "q" ? [tk.col - String(tk.cur).length + 1, tk.col] : null;
      const isF = (r, c) => fc && r === tk.row && c >= fc[0] && c <= fc[1];
      const rows = [
        { cells: D.map((_, c) => ({ v: qd[c], cls: tk && tk.t === "q" && tk.col === c ? "cur" : (qd[c] !== undefined ? "in" : "") })) },
        { lab: `<span>${b}</span><span class="brk">)</span>`, labCls: "divlab", bar: true, cells: D.map((v, c) => ({ v, cls: isF(-1, c) ? "focus" : "" })) }
      ];
      for (let r = 0; r < wr; r++) {
        const w = work[r] || {}, here = tk && tk.t !== "q" && tk.row === r;
        if (!Object.keys(w).length && !here) continue;
        rows.push({ line: r % 2 === 0, cells: D.map((_, c) => {
          const x = w[c], isCur = here && tk.col === c;
          return { v: x ? x.v : "", cls: [isCur ? "cur" : "", x ? x.cls : "", isF(r, c) ? "focus" : ""].join(" ") };
        }) });
      }
      return { W: n, rows };
    },
    input(d) {
      const tk = tasks[ti];
      if (d !== tk.v) {
        if (tk.t === "q") {
          if (d * b > tk.cur) return { ok: false, msg: `${b}×${d}＝${b * d} は ${tk.cur} より大きいね。もっと小さい数を たてよう。` };
          return { ok: false, msg: `${tk.cur}−${b * d}＝${tk.cur - b * d} で、わる数の ${b} より大きくなるね。もっと大きい数を たてよう。` };
        }
        if (tk.t === "prod") return { ok: false, msg: `${tk.q}×${b} を もう一度 計算しよう。` };
        return { ok: false, msg: `${tk.cur}−${tk.pr} を もう一度 計算しよう。` };
      }
      if (tk.t === "q") qd[tk.col] = d;
      else { (work[tk.row] = work[tk.row] || {})[tk.col] = { v: d, cls: tk.t === "diff0" ? "zero" : "in" }; }
      ti++;
      let msg = tk.t === "q" && d === 0 && tasks[ti] ? "0 をたてたときは、かけ算・ひき算は しないで、つぎの数をおろそう。" : "";
      while (tasks[ti] && tasks[ti].t === "down") {
        const dn = tasks[ti], rw = (work[dn.row] = work[dn.row] || {});
        Object.keys(rw).forEach(c => { if (rw[c].cls === "zero") delete rw[c]; });
        rw[dn.col] = { v: dn.v, cls: "down" };
        msg += `${dn.v} をおろしたよ。`;
        ti++;
      }
      return { ok: true, msg, done: ti >= tasks.length };
    },
    hint() {
      const tk = tasks[ti];
      if (tk.t === "q") {
        const head = tk.first && i0 > 0 ? `${D.slice(0, i0).join("")} の中に ${b} はないので、${tk.cur} で考えるよ。` : "";
        if (tk.v === 0) return head + `${tk.cur} の中に ${b} は ないね。商に 0 をたてよう。`;
        return head + `${tk.cur} の中に ${b} は いくつ？ ${b}×□ が ${tk.cur} をこえない、いちばん大きい数を見つけよう。`;
      }
      if (tk.t === "prod") return `たてた ${tk.q} と、わる数の ${b} をかけよう。${tk.q}×${b}＝？`;
      return `${tk.cur}−${tk.pr} を計算しよう。`;
    }
  };
  return H;
}

/* ---- 計算パネル ---- */
function makeHs() {
  const { a, op, b } = cx;
  return op === "+" ? hsAdd(a, b) : op === "-" ? hsSub(a, b) : op === "*" ? hsMul(a, b) : hsDiv(a, b);
}
function startCalc(k) {
  const a = tokens[k - 1].v, op = tokens[k].v, b = tokens[k + 1].v;
  cx = { k, a, op, b, r: calc(a, op, b), canH: hissanOK(a, op, b), buf: "", hintSid: -1, hintN: 0, msg: "", msgCls: "", shake: false };
  cx.how = (!cx.canH || isEasy(a, op, b)) ? "anzan" : "hissan";
  if (cx.how === "hissan") { cx.hs = makeHs(); calcIntro(); }
  setMsg("info", `${a} ${SYM[op]} ${b} を計算しよう。`);
  renderCalc();
}
function calcIntro() {
  cx.msg = cx.op === "*" && cx.hs.swapped ? `けたの多い ${cx.hs.top} を上にして計算するよ（×は 入れかえても 答えは同じ）。` : "";
  cx.msgCls = cx.msg ? "info" : "";
}
function gridHTML(g) {
  let h = `<div class="hs" style="grid-template-columns: auto repeat(${g.W}, var(--cw))">`;
  g.rows.forEach(r => {
    const rc = (r.memo ? " m" : "") + (r.line ? " ln" : "");
    h += `<div class="hl${rc}${r.labCls ? " " + r.labCls : ""}">${r.lab || ""}</div>`;
    r.cells.forEach(c => {
      let cls = (c.cls || "") + (r.bar ? " bar" : "");
      if (cx.shake && /\bcur\b/.test(cls)) cls += " ng";
      const v = c.v === undefined || c.v === null ? "" : c.v;
      h += `<div class="hc${rc} ${cls}"${c.top !== undefined ? ` data-top="${c.top}"` : ""}>${v}</div>`;
    });
  });
  return h + "</div>";
}
function renderCalc() {
  const box = $("calc");
  if (!cx) { box.style.display = "none"; box.innerHTML = ""; return; }
  box.style.display = "";
  const { a, op, b } = cx;
  let h = `<div class="ctop"><span class="ctitle">${a} ${SYM[op]} ${b} ＝ ？</span>`;
  if (cx.canH && !calcLock) h += `<button class="cbtn" data-act="switch">${cx.how === "hissan" ? "あんざんで答える" : "筆算でとく"}</button>`;
  h += `</div>`;
  if (cx.how === "hissan") {
    if (op === "/") {
      const ph = cx.hs.phase();
      h += `<div class="phase">${["たてる", "かける", "ひく", "おろす"].map((s, i) => `<span class="${i === ph ? "cur" : ""}">${s}</span>`).join("→")}</div>`;
    }
    h += gridHTML(cx.hs.grid());
  } else {
    h += `<div class="anz"><span>${a} ${SYM[op]} ${b} ＝</span><span class="box">${cx.buf}</span></div>`;
  }
  h += `<div id="cmsg" class="${cx.msgCls}">${cx.msg}</div>`;
  if (!calcLock) {
    h += `<div class="ckeys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button data-d="${d}">${d}</button>`).join("")}` +
      (cx.how === "anzan" ? `<button class="wide" data-act="back">けす</button><span></span><button class="wide okb" data-act="ok">こたえる</button>` : "") + `</div>`;
    h += `<div class="cfoot"><button class="cbtn" data-act="hint">計算のヒント</button>`;
    if (cx.how === "hissan" && cx.hs.teineiUsed) h += `<label class="teinei"><input type="checkbox" id="teinei"${teinei ? " checked" : ""}>${op === "+" ? "くり上がり" : "くり下がり"}も 自分で書く</label>`;
    h += `</div>`;
  }
  box.innerHTML = h;
  cx.shake = false;
}
function calcResult(res) {
  if (!res) return;
  if (!res.ok) { calcMiss++; totalCalcMiss++; cx.msg = res.msg; cx.msgCls = "bad"; cx.shake = true; }
  else { cx.msg = res.msg || ""; cx.msgCls = res.msg ? "info" : ""; }
  if (res.ok && res.done) { calcDone(); return; }
  renderCalc();
}
function calcInput(d) {
  if (!cx || calcLock) return;
  if (cx.how === "anzan") { if (cx.buf.length < 6) cx.buf = (cx.buf === "0" ? "" : cx.buf) + d; renderCalc(); return; }
  calcResult(cx.hs.input(d));
}
function calcAct(act) {
  if (!cx || calcLock) return;
  if (act === "hint") return calcHint();
  if (act === "switch") {
    cx.how = cx.how === "hissan" ? "anzan" : "hissan"; cx.buf = "";
    if (cx.how === "hissan") { cx.hs = makeHs(); calcIntro(); } else { cx.msg = ""; cx.msgCls = ""; }
  }
  if (act === "back") cx.buf = cx.buf.slice(0, -1);
  if (act === "ok") {
    if (cx.buf === "") return;
    if (Number(cx.buf) === cx.r) { calcDone(); return; }
    calcMiss++; totalCalcMiss++; cx.buf = "";
    cx.msg = "ちがうよ。" + (cx.canH ? "「筆算でとく」で たしかめてみよう。" : "もう一度 計算してみよう。"); cx.msgCls = "bad";
  }
  renderCalc();
}
function calcHint() {
  if (!cx || calcLock) return;
  if (cx.how === "anzan") {
    const { a, op, b } = cx;
    cx.msg = op === "*" ? `${a} のだん（または ${b} のだん）の九九を 思い出そう。`
      : op === "/" ? `${b} のだんの九九で、答えが ${a} になるのは？`
      : "「筆算でとく」をおすと、位ごとに計算できるよ。";
    cx.msgCls = "info"; renderCalc(); return;
  }
  const H = cx.hs, sid = H.sid(), tk = H.task();
  if (cx.hintSid === sid) cx.hintN++; else { cx.hintSid = sid; cx.hintN = 1; }
  let m = H.hint();
  if (cx.hintN >= 2 && tk.v !== undefined) m += `　→ ここには「${tk.v}」が 入るよ。`;
  cx.msg = m; cx.msgCls = "info";
  renderCalc();
}
function calcDone() {
  const { k, a, op, b, r } = cx, seq = calcSeq;
  calcLock = true;
  cx.msg = `できた！ ${a} ${SYM[op]} ${b} ＝ ${r}`; cx.msgCls = "ok";
  if (cx.how === "anzan") cx.buf = String(r);
  renderCalc();
  setTimeout(() => {
    if (seq !== calcSeq) return;
    cx = null; calcLock = false; renderCalc();
    const step = applyStep(tokens, k);
    setMsg("ok", `${a} ${SYM[op]} ${b} ＝ ${r}`);
    stepNo++;
    setTimeout(() => { if (seq === calcSeq) commitStep(step); }, 450);
  }, 1100);
}
$("calc").addEventListener("click", e => {
  const el = e.target.closest("[data-d],[data-top],[data-act]");
  if (!el || !cx || calcLock) return;
  if (el.dataset.d !== undefined) calcInput(Number(el.dataset.d));
  else if (el.dataset.top !== undefined) { if (cx.how === "hissan" && cx.hs.tapTop) calcResult(cx.hs.tapTop(Number(el.dataset.top))); }
  else calcAct(el.dataset.act);
});
$("calc").addEventListener("change", e => {
  if (e.target.id !== "teinei" || !cx) return;
  teinei = e.target.checked; save("junjo_teinei", teinei);
  if (cx.how === "hissan") { cx.hs = makeHs(); cx.msg = "はじめから 書きなおそう。"; cx.msgCls = "info"; }
  renderCalc();
});
document.addEventListener("keydown", e => {
  if (!cx || calcLock || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (/^[0-9]$/.test(e.key)) { calcInput(Number(e.key)); e.preventDefault(); }
  else if (cx.how === "anzan" && e.key === "Backspace") { calcAct("back"); e.preventDefault(); }
  else if (cx.how === "anzan" && e.key === "Enter") { calcAct("ok"); e.preventDefault(); }
});

/* ================= 先生用：問題の追加 ================= */
function validate(str) {
  const t = tokenize(str);
  if (!t || !t.length) return { ok: false, err: "使えない文字があります。" };
  let d = 0, prev = null, ops = 0;
  for (const x of t) {
    const p = prev ? prev.t : null;
    if (x.t === "num" && !(p === null || p === "op" || p === "(")) return { ok: false, err: "式の形がおかしいところがあります。" };
    if (x.t === "op" && !(p === "num" || p === ")")) return { ok: false, err: "記号の前に数がありません。" };
    if (x.t === "(" && !(p === null || p === "op" || p === "(")) return { ok: false, err: "（ の前には記号が必要です。" };
    if (x.t === ")" && !(p === "num" || p === ")")) return { ok: false, err: "） の前に数がありません。" };
    if (x.t === "(") d++;
    if (x.t === ")") { d--; if (d < 0) return { ok: false, err: "（ ）の数が合いません。" }; }
    if (x.t === "op") ops++;
    prev = x;
  }
  if (d !== 0 || !(prev.t === "num" || prev.t === ")")) return { ok: false, err: "（ ）の数が合わないか、式が記号で終わっています。" };
  if (!ops) return { ok: false, err: "記号が1つ以上ある式を入れてください。" };
  let s = stripLoneParens(t);
  while (s.length > 1) {
    const k = validOps(s)[0];
    const r = calc(s[k - 1].v, s[k].v, s[k + 1].v);
    if (r === null) return { ok: false, err: "わり切れない÷があります。" };
    if (r < 0) return { ok: false, err: "とちゅうで答えがマイナスになります。" };
    s = stripLoneParens(s.slice(0, k - 1).concat([{ t: "num", v: r }], s.slice(k + 2)));
  }
  return { ok: true, norm: toAscii(t), ans: s[0].v };
}
function renderCustomList() {
  $("customList").textContent = custom.length ? "追加した問題：" + custom.map(p => toStr(tokenize(p))).join("　") : "";
}
$("addBtn").onclick = () => {
  const v = validate($("addInput").value);
  const m = $("addMsg");
  if (!v.ok) { m.style.color = "#b03030"; m.textContent = v.err; return; }
  if (custom.includes(v.norm)) { m.style.color = "#b03030"; m.textContent = "その問題はもう入っています。"; return; }
  custom.push(v.norm); save("junjo_custom", custom);
  m.style.color = "#1f7a43"; m.textContent = `追加しました（答え ${v.ans}）。「先生の問題」で出題されます。`;
  $("addInput").value = "";
  renderCustomList();
  if (lv === 0) newSet(); else renderLevels();
};
$("clearCustom").onclick = () => {
  if (!custom.length) return;
  if (!confirm("追加した問題をすべて消しますか？")) return;
  custom = []; save("junjo_custom", custom); renderCustomList();
  $("addMsg").textContent = "";
  if (lv === 0) newSet(); else renderLevels();
};

renderCustomList();
newSet();
</script>
