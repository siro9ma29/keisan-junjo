<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算の順じょ</title>
<style>
  :root {
    --bg: #fff7e8; --ink: #2f2e3a; --sub: #8a8578; --line: #efe4cf;
    --navy: #2f5d8a; --blue: #3d8bfd; --orange: #f08c00; --purple: #8a5cf0;
    --green: #2a9d55; --red: #e5484d; --gold: #ffc53d; --goldd: #c98a00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
    background: var(--bg); color: var(--ink);
    background-image: radial-gradient(circle at 12% 0%, #ffe9c2 0 140px, transparent 141px), radial-gradient(circle at 100% 30%, #e8f0ff 0 180px, transparent 181px);
    background-attachment: fixed;
    touch-action: manipulation; transition: background-color .4s;
  }
  body.battle { background: #141936; background-image: none; }
  button { font-family: inherit; }
  svg { display: block; }
  .track .tkhero svg, .piece svg, .goal .gi svg, .ovart svg, .rart svg, .monster svg { width: 100%; height: 100%; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 20px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 4px 0 var(--line); }
  body.battle .card { box-shadow: 0 4px 0 #0c0f26; }

  /* ---- ヘッダー ---- */
  .hero {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
    background: linear-gradient(120deg, #2f5d8a, #5a4fcf 70%, #8a5cf0); color: #fff;
    border-radius: 22px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 5px 0 #3b3591;
  }
  .hero h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); letter-spacing: .06em; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .hero h1 small { display: block; font-size: 13px; letter-spacing: .1em; opacity: .85; font-weight: normal; }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: bold; white-space: nowrap; }
  .chip.star { background: #fff; color: var(--goldd); border-color: #fff; }
  .chip.rank { background: var(--gold); color: #5b3d00; border-color: var(--gold); }
  .chip.snd { cursor: pointer; padding: 4px 9px; }

  .rules { display: flex; flex-wrap: wrap; gap: 8px; font-size: 16px; }
  .rules span { background: #eef5ff; border-radius: 12px; padding: 6px 10px; }
  .rules b { color: var(--navy); }

  /* ---- モード ---- */
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .mode {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px;
    border: 3px solid var(--c); background: #fff; color: var(--c); border-radius: 18px; padding: 8px 4px 9px; cursor: pointer;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 45%, #fff); transition: transform .08s;
  }
  .mode:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 45%, #fff); }
  .mode .mi { font-size: 26px; line-height: 1.1; }
  .mode .mt { font-size: 18px; font-weight: bold; white-space: nowrap; }
  .mode .ms { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .mode.on { background: var(--c); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 60%, #000); }
  .mode.on .ms { color: rgba(255,255,255,.85); }
  .mode.locked { filter: grayscale(.85); opacity: .8; }
  .mode .cnt { position: absolute; top: -9px; right: -6px; background: var(--gold); color: #5b3d00; font-size: 12px; font-weight: bold; border-radius: 999px; padding: 1px 7px; box-shadow: 0 2px 0 var(--goldd); }
  @media (max-width: 560px) { .mode .mt { font-size: 15px; } .mode .mi { font-size: 22px; } .mode .ms { font-size: 11px; } }

  /* ---- レベル ---- */
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .levels { grid-template-columns: repeat(2, 1fr); } }
  .lvc {
    position: relative; overflow: hidden; text-align: left; cursor: pointer;
    border: 3px solid #dfe6ef; background: #fff; border-radius: 16px; padding: 8px 10px 8px; color: var(--ink);
    box-shadow: 0 4px 0 #dfe6ef;
  }
  .lvc:active { transform: translateY(2px); }
  .lvc .ln { display: block; font-size: 19px; font-weight: bold; color: var(--mc); }
  .lvc .lt { display: block; font-size: 13px; color: var(--sub); margin: 1px 0 3px; min-height: 1.3em; }
  .lvc .ls { display: block; font-size: 22px; letter-spacing: 2px; line-height: 1; }
  .lvc.cur { border-color: var(--mc); box-shadow: 0 4px 0 var(--mc); background: color-mix(in srgb, var(--mc) 7%, #fff); }
  .lvc.clr { background-image: linear-gradient(135deg, #fffbe8, #fff); }
  .rib { position: absolute; top: 9px; right: -26px; transform: rotate(35deg); background: var(--green); color: #fff; font-size: 11px; font-weight: bold; padding: 1px 28px; letter-spacing: .1em; }
  .s-on { color: var(--gold); text-shadow: 0 1px 0 var(--goldd); }
  .s-off { color: #e4dfd4; }
  .tbtn { margin-top: 10px; font-size: 14px; color: #666; background: #f4f4f4; border: 2px solid #ddd; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  .tbtn.cur { background: #666; color: #fff; border-color: #666; }
  #lvdesc { margin: 12px 0 0; font-size: 16px; color: #444; }
  #lvdesc .tag { display: inline-block; background: #fff2cc; border-radius: 8px; padding: 2px 10px; margin: 2px 4px 2px 0; }
  .crit { margin-top: 8px; background: #f6f9ff; border: 2px dashed #c9d6e6; border-radius: 14px; padding: 8px 12px; font-size: 15px; }
  .crit b { color: var(--navy); }
  .crit ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .crit li { margin: 2px 0; }
  .crit li .s { display: inline-block; width: 4.2em; color: var(--goldd); font-weight: bold; }
  .crit li.need { font-weight: bold; }
  .crit li.need::after { content: "← クリア"; color: var(--green); margin-left: 6px; }
  .crit li.got { opacity: .55; text-decoration: line-through; }

  /* ---- プレイ ---- */
  .ptop { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  #prog { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  #prog i { width: 18px; height: 18px; border-radius: 50%; background: #e3e8ef; display: inline-block; }
  #prog i.ok { background: var(--green); }
  #prog i.perf { background: var(--gold); box-shadow: inset 0 -2px 0 var(--goldd); }
  #prog i.now { background: var(--navy); box-shadow: 0 0 0 3px #bcd3ea; }
  #combo { font-weight: bold; color: #e8590c; font-size: 16px; }
  #combo:not(:empty) { animation: pop .5s; background: #fff0e0; border-radius: 999px; padding: 2px 10px; }
  .qno { text-align: center; color: #888; font-size: 15px; margin: 0 0 4px; }

  .guide { text-align: center; font-size: 17px; margin: 0 0 6px; }
  .key { display: inline-block; background: #eef5ff; border-radius: 6px; padding: 0 6px; margin: 0 2px; font-weight: bold; }

  #expr {
    position: relative;
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    min-height: 110px; padding: 12px 0;
    font-size: clamp(30px, 7vw, 56px); font-weight: bold; font-variant-numeric: tabular-nums;
  }
  #expr span { padding: 4px 2px; border-radius: 10px; transition: background .2s; }
  #expr .par { color: #7a5bb5; }
  #expr .fresh { color: #d6336c; }
  #expr .hl { background: #ffe066; }
  #expr .op {
    font: inherit; font-size: 1em; font-weight: bold; color: var(--navy);
    background: #eef5ff; border: 3px solid #bcd3ea; border-radius: 14px;
    min-width: 1.4em; margin: 0 6px; padding: 0 6px; cursor: pointer; line-height: 1.3;
    box-shadow: 0 4px 0 #bcd3ea;
  }
  #expr .op:active { transform: translateY(3px); box-shadow: 0 1px 0 #bcd3ea; }
  #expr .op.hl { background: #ffe066; border-color: #f2a900; box-shadow: 0 4px 0 #f2a900; }
  #expr .op.hint { animation: glow 1s infinite; border-color: #f08c00; }
  #expr .op.ng { background: #ffd6d6; border-color: #e03131; color: #b03030; animation: shake .4s; }
  #expr .inum { color: var(--navy); }
  #msg { min-height: 52px; text-align: center; font-size: 20px; border-radius: 14px; padding: 12px; }
  #msg.ok   { background: #e6f7ec; color: #1f7a43; }
  #msg.bad  { background: #ffeaea; color: #b03030; }
  #msg.info { background: #fff6e0; color: #8a5a00; }
  #msg.done { background: #ffe9f1; color: #c2255c; font-weight: bold; font-size: 24px; animation: pop .45s; }

  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .btn {
    font: inherit; font-size: 18px; font-weight: bold; padding: 10px 20px;
    border-radius: 14px; border: none; cursor: pointer; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.hintb { background: #f08c00; }
  .btn.reset { background: #868e96; }
  .btn.next  { background: var(--navy); }
  .btn.next.big { background: #d6336c; font-size: 22px; padding: 12px 28px; animation: pulse 1.2s infinite; }
  .btn.again { background: var(--green); }
  .btn.adv { background: var(--purple); }

  /* ---- 結果 ---- */
  .result { text-align: center; padding: 6px 0; position: relative; width: 100%; }
  .rstars { font-size: clamp(44px, 12vw, 64px); letter-spacing: 6px; line-height: 1.1; }
  .rstars span { display: inline-block; }
  .rstars .s-on { animation: starIn .6s both; }
  .rstars span:nth-child(2) { animation-delay: .25s; }
  .rstars span:nth-child(3) { animation-delay: .5s; }
  .result .big { font-size: clamp(26px, 6vw, 34px); font-weight: bold; color: #d6336c; margin: 4px 0; }
  .result p { font-size: 18px; margin: 6px 0; font-weight: normal; }
  .stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .stats span { background: #f4f1ea; border-radius: 999px; padding: 4px 12px; font-size: 16px; }
  .stats span.z { background: #e6f7ec; color: #1f7a43; }
  .stats .hrt { color: var(--red); }
  .stamp {
    display: inline-block; border: 4px solid var(--green); color: var(--green); border-radius: 12px;
    font-size: 26px; font-weight: bold; letter-spacing: .15em; padding: 0 14px; transform: rotate(-8deg);
    animation: stamp .5s .75s both; background: #fff;
  }
  .goalnote { display: inline-block; background: #fff6e0; color: #8a5a00; border-radius: 12px; padding: 6px 12px; font-size: 16px; }
  .newrec { display: inline-block; background: var(--gold); color: #5b3d00; font-weight: bold; border-radius: 999px; padding: 4px 16px; font-size: 18px; animation: pop .6s 1s both; }
  .unlockbar { margin: 10px auto 0; max-width: 380px; font-size: 15px; color: var(--purple); font-weight: bold; }
  .unlockbar .ub { height: 14px; background: #eee6ff; border-radius: 999px; overflow: hidden; margin-top: 4px; border: 2px solid #d9cbff; }
  .unlockbar .ub i { display: block; height: 100%; background: linear-gradient(90deg, #a98bff, var(--purple)); }
  .rart { width: 110px; height: 110px; margin: 0 auto; }
  .rart.beaten svg { transform: rotate(-14deg); filter: grayscale(.7); opacity: .75; }

  #log { font-size: clamp(18px, 3.4vw, 26px); line-height: 1.8; font-variant-numeric: tabular-nums; }
  #log .line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  #log .eq { width: 1.2em; color: #888; }
  #log .empty { color: #aaa; font-size: 16px; }
  .ttl { font-size: 15px; color: #888; margin: 0 0 6px; }

  details summary { cursor: pointer; color: #666; font-size: 15px; }
  .add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .add input { flex: 1; min-width: 200px; font-size: 18px; padding: 8px 10px; border-radius: 10px; border: 2px solid #c9d6e6; }
  .add button, .tools button { font-size: 16px; padding: 8px 14px; border-radius: 10px; border: none; background: var(--navy); color: #fff; cursor: pointer; }
  .add button.sub, .tools button.sub { background: #adb5bd; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #ddd; font-size: 15px; }
  .tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .tools input { width: 20px; height: 20px; }
  #addMsg { font-size: 15px; margin-top: 6px; min-height: 1.2em; }
  #customList { font-size: 15px; color: #555; margin-top: 6px; }
  .small { font-size: 14px; color: #777; }

  /* ---- 計算モード（筆算） ---- */
  #calc { margin: 8px auto 0; max-width: 640px; border: 3px solid #f2a900; border-radius: 16px; background: #fffdf5; padding: 12px 12px 14px; }
  .ctop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .ctitle { font-size: 24px; font-weight: bold; color: #333; font-variant-numeric: tabular-nums; }
  .cbtn { font: inherit; font-size: 15px; font-weight: bold; padding: 6px 12px; border-radius: 10px; border: 2px solid #868e96; background: #fff; color: #555; cursor: pointer; }
  .cnote { font-size: 15px; color: #666; margin: 6px 0 0; }
  .phase { display: flex; justify-content: center; gap: 4px; margin: 10px 0 0; flex-wrap: wrap; }
  .phase span { font-size: 16px; padding: 3px 10px; border-radius: 10px; background: #f1f3f5; color: #999; }
  .phase span.cur { background: var(--navy); color: #fff; font-weight: bold; }
  .hs { --cw: clamp(38px, 10vw, 54px); display: grid; justify-content: center; margin: 12px auto 6px;
        font-size: calc(var(--cw) * .7); font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; }
  .hs .hc, .hs .hl { height: calc(var(--cw) * 1.08); display: flex; align-items: center; justify-content: center; position: relative; }
  .hs .hl { justify-content: flex-end; padding-right: 6px; color: var(--navy); min-width: 1.1em; }
  .hs .m { height: calc(var(--cw) * .58); font-size: .52em; color: #e8590c; align-items: flex-end; padding-bottom: 2px; }
  .hs .ln { border-bottom: 3px solid #333; }
  .hs .hc.bar { border-top: 3px solid #333; }
  .hs .divlab { padding-right: 0; color: #333; }
  .hs .divlab .brk { font-size: 1.25em; transform: scaleY(1.25); margin: 0 0 0 2px; font-weight: normal; }
  .hs .hc.focus { background: #e7f1ff; }
  .hs .hc.in { color: var(--navy); }
  .hs .hc.down { color: #1c7ed6; }
  .hs .hc.down::after { content: "↓"; position: absolute; top: -2px; right: 2px; font-size: .38em; color: #1c7ed6; }
  .hs .hc.zero { color: #c3c9cf; }
  .hs .hc.cur { background: #fff3bf; border-radius: 8px; box-shadow: inset 0 0 0 3px #f08c00; animation: glow 1s infinite; }
  .hs .hc.m.cur { box-shadow: inset 0 0 0 2px #f08c00; }
  .hs .hc.ng { background: #ffd6d6; box-shadow: inset 0 0 0 3px #e03131; animation: shake .4s; }
  .hs .hc.strike { color: #9aa1a8; background: linear-gradient(to top right, transparent calc(50% - 2px), #e03131 calc(50% - 1px), #e03131 calc(50% + 1px), transparent calc(50% + 2px)); }
  .hs .hc.tap { cursor: pointer; border-radius: 8px; box-shadow: inset 0 0 0 2px #bcd3ea; }
  .hs .hc.tap:active { transform: scale(.94); }
  .hs .hc.hintc { box-shadow: inset 0 0 0 3px #f08c00; animation: glow 1s infinite; }
  .anz { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 14px 0 6px; font-size: clamp(28px, 6vw, 40px); font-weight: bold; }
  .anz .abox { min-width: 4.2em; height: 1.5em; border: 3px solid #f08c00; border-radius: 12px; background: #fff3bf; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font-variant-numeric: tabular-nums; color: var(--navy); }
  #cmsg { min-height: 44px; text-align: center; font-size: 19px; border-radius: 12px; padding: 10px; margin-top: 6px; }
  #cmsg.ok { background: #e6f7ec; color: #1f7a43; font-weight: bold; }
  #cmsg.bad { background: #ffeaea; color: #b03030; }
  #cmsg.info { background: #fff6e0; color: #8a5a00; }
  .ckeys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 440px; margin: 10px auto 0; }
  .ckeys button { font: inherit; font-size: 28px; font-weight: bold; padding: 8px 0; border-radius: 12px; border: 3px solid #c9d6e6; background: #fff; color: #333; cursor: pointer; box-shadow: 0 3px 0 #c9d6e6; }
  .ckeys button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9d6e6; background: #eef5ff; }
  .ckeys button.wide { grid-column: span 2; font-size: 20px; }
  .ckeys button.okb { background: var(--green); border-color: var(--green); color: #fff; }
  .cfoot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .teinei { font-size: 16px; color: #555; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .teinei input { width: 20px; height: 20px; }

  /* ---- 冒険：ロック ---- */
  .lock { text-align: center; padding: 6px 0 4px; }
  .lock .lk-ic { font-size: 54px; animation: wob 1.6s ease-in-out infinite alternate; display: inline-block; }
  .lock h3 { margin: 4px 0; font-size: 21px; color: var(--purple); }
  .lock p { margin: 4px 0 10px; font-size: 16px; color: #555; }
  .lk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  @media (max-width: 520px) { .lk-cols { grid-template-columns: 1fr; } }
  .lk-col { background: #f8f6ff; border-radius: 14px; padding: 8px 12px; }
  .lk-col h4 { margin: 0 0 4px; font-size: 16px; color: var(--c); }
  .lk-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 16px; border-bottom: 1px dashed #e5def8; }
  .lk-row:last-child { border-bottom: none; }
  .lk-row .ok { color: var(--green); font-weight: bold; }
  .lk-row .ls { font-size: 18px; letter-spacing: 1px; }

  /* ---- 冒険：マップ ---- */
  .goal { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 10px 14px;
    border: 4px solid var(--c); box-shadow: 0 4px 10px rgba(0,0,0,.08); margin-bottom: 10px; }
  .goal .gi { width: 58px; height: 58px; flex: none; }
  .goal .gt { flex: 1; min-width: 0; }
  .goal .gt b { display: block; font-size: 20px; }
  .goal .gt span { font-size: 14px; color: var(--sub); }
  .gobtn { background: var(--c); color: #fff; border: none; cursor: pointer; font-size: 20px; font-weight: bold; border-radius: 16px; padding: 12px 18px; box-shadow: 0 4px 0 rgba(0,0,0,.2); white-space: nowrap; }
  .gobtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .goal .gt b { white-space: nowrap; }
  @media (max-width: 480px) { .goal { flex-wrap: wrap; } .goal .gobtn { width: 100%; } .goal .gt b { font-size: 18px; } }
  .mapmsg { text-align: center; margin-bottom: 8px; }
  .island { background: #fff; border-radius: 22px; padding: 10px 14px 14px; margin-bottom: 12px;
    box-shadow: 0 4px 0 var(--line); border: 2px solid #f1ead9; border-top: 10px solid var(--c);
    background-image: radial-gradient(circle at 92% 125%, color-mix(in srgb, var(--c) 16%, transparent) 0 40%, transparent 41%); }
  .island.locked { filter: grayscale(1); opacity: .55; }
  .ihead { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }
  .ihead .ist { font-size: 15px; color: var(--c); }
  .ihead small { font-weight: normal; color: var(--sub); font-size: 13px; margin-left: 6px; }
  .path { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 46px 2px 4px; }
  .path::before { content: ""; position: absolute; left: 28px; right: 40px; top: calc(46px + 26px); border-top: 6px dashed #e6dcc8; }
  .node { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; background: #f4efe6; border: 4px solid #e6dcc8;
    font-weight: bold; font-size: 20px; color: #b5ad9c; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; cursor: pointer; }
  .node:disabled { cursor: default; }
  .node.done { background: var(--c); border-color: var(--c); color: #fff; }
  .node.cur { border-color: var(--c); background: #fff; color: var(--c); animation: npulse 1.2s infinite; }
  .node .nst { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; letter-spacing: 0; }
  .node.boss { width: 76px; height: 76px; border-radius: 22px; background: #fff; padding: 4px; }
  .node.boss svg { width: 100%; height: 100%; }
  .node.boss.done svg { opacity: .5; }
  .node.boss.done::after { content: "★"; position: absolute; right: -6px; top: -8px; color: var(--gold); font-size: 26px; text-shadow: 0 1px 0 #b07d00; }
  .node.pop { animation: pop .7s; }
  .piece { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); width: 34px; height: 42px; pointer-events: none; }
  .piece.hop { animation: hop .8s .2s both; }
  .mapfoot { text-align: center; font-size: 14px; color: var(--sub); margin-top: 6px; }
  @media (max-width: 380px) { .node { width: 44px; height: 44px; font-size: 17px; } .node.boss { width: 64px; height: 64px; } .path::before { top: calc(46px + 22px); } }

  /* ---- 冒険：ステージ表示 ---- */
  #hud:empty { display: none; }
  #hud { margin: -4px -6px 12px; }
  .mback { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 14px; color: var(--sub); cursor: pointer; white-space: nowrap; }
  .shud { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--c) 12%, #fff); border: 3px solid var(--c); border-radius: 18px; padding: 8px 12px; flex-wrap: wrap; }
  .shud .st { flex: 1; min-width: 120px; }
  .shud .st b { display: block; font-size: 19px; color: var(--c); }
  .shud .st span { font-size: 13px; color: var(--sub); }
  .track { flex: 2; min-width: 200px; position: relative; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 18px 6px 0; }
  .track::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; border-top: 5px dotted color-mix(in srgb, var(--c) 45%, #fff); }
  .track i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid color-mix(in srgb, var(--c) 45%, #fff); font-style: normal; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .track i.ok { background: var(--c); border-color: var(--c); color: #fff; }
  .track i.goal { width: 30px; height: 30px; font-size: 16px; background: var(--gold); border-color: var(--goldd); }
  .track .tkhero { position: absolute; top: -6px; width: 28px; height: 34px; transition: left .6s cubic-bezier(.3,1.6,.6,1); }

  /* ---- 冒険：ボス戦（RPGふう） ---- */
  .bhud { color: #fff; border-radius: 18px; padding: 10px 14px 12px;
    background: radial-gradient(ellipse 70% 60% at 50% 62%, #34428e 0%, #232b66 45%, #1b2150 75%, #171c44 100%);
    box-shadow: 0 4px 0 #0c0f26, inset 0 0 0 2px #2c3470; }
  .bhud .mback { background: #232a5a; border-color: #3b4384; color: #c9cff5; }
  .bh-top { display: flex; align-items: center; gap: 8px; }
  .bh-isl { color: #f5c542; font-weight: bold; font-size: 16px; letter-spacing: 1px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hearts { font-size: 22px; letter-spacing: 2px; color: #ff5c7a; text-shadow: 0 0 6px rgba(255,92,122,.6); white-space: nowrap; }
  .hearts .lost { color: #3b4380; text-shadow: none; }
  .hearts .just { display: inline-block; animation: heartOut .6s; }
  .bh-name { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .bh-name b { font-size: 17px; white-space: nowrap; }
  .hp { flex: 1; height: 18px; background: #0f1330; border: 2px solid #e8ebff; border-radius: 999px; overflow: hidden; }
  .hp i { display: block; height: 100%; background: #4cd97b; transition: width .5s, background .5s; }
  .hpn { font-size: 13px; font-weight: bold; color: #c9cff5; min-width: 56px; text-align: right; white-space: nowrap; }
  .bh-mid { position: relative; height: 118px; display: flex; justify-content: center; align-items: center; }
  .monster { width: 104px; height: 104px; position: relative; z-index: 1; animation: float 2s ease-in-out infinite; }
  .monster.hit { animation: hit .5s; }
  .monster.crit { animation: hit .5s, critflash .5s; }
  .monster.atk { animation: atk .5s; }
  .monster.down { animation: down 1.1s forwards; }
  .shadow { position: absolute; left: 50%; bottom: 6px; width: 190px; height: 20px; margin-left: -95px; border-radius: 50%; background: #11163a; opacity: .85; }
  .dmg { position: absolute; left: calc(50% + 60px); top: 18px; white-space: nowrap; font-size: 30px; font-weight: bold; color: #ffb74d;
    text-shadow: 0 2px 0 #1b2150; opacity: 0; pointer-events: none; }
  .dmg.crit { color: #ff6b6b; font-size: 34px; }
  .dmg.show { animation: dmg 1s; }
  .msgwin { margin-top: 6px; background: #12152e; border: 3px solid #f5c542; border-radius: 10px; padding: 8px 12px;
    min-height: 3.1em; font-size: 17px; line-height: 1.5; font-weight: bold; letter-spacing: .5px; }
  .msgwin .red { color: #ff8a8a; } .msgwin .gold { color: #f5c542; }
  body.flash .bhud { animation: flashB .45s; }
  @media (max-width: 600px) { .msgwin { font-size: 15px; padding: 6px 10px; } .bh-mid { height: 100px; } .monster { width: 90px; height: 90px; } .shadow { width: 150px; margin-left: -75px; } .dmg, .dmg.crit { left: 0; right: 0; top: -4px; text-align: center; font-size: 28px; } }

  /* ---- 花火 ---- */
  #fx b.spark { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; box-shadow: 0 0 6px currentColor;
    animation: spark var(--t, .9s) ease-out forwards; }
  #fx b.rocket { position: absolute; width: 5px; height: 16px; margin-left: -2px; border-radius: 3px;
    background: linear-gradient(#fff, #ffc53d 40%, rgba(255,140,0,0)); animation: rise var(--t, .5s) ease-out forwards; }
  @keyframes spark { 0% { transform: translate(0,0) scale(1.2); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  @keyframes rise { 0% { transform: translateY(var(--h)); opacity: 1; } 100% { transform: translateY(0); opacity: .2; } }

  /* ---- 花火工房 ---- */
  .levels.craft { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 640px) { .levels.craft { grid-template-columns: repeat(3, 1fr); } .levels.craft .lt { font-size: 12px; } }
  .target { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 2px 0 4px; }
  .target .tl { font-size: 16px; color: #b5179e; font-weight: bold; }
  .target .tv { font-size: clamp(34px, 8vw, 48px); font-weight: bold; color: #fff; background: radial-gradient(circle at 50% 40%, #ff5fa2, #b5179e);
    border-radius: 18px; padding: 0 18px; box-shadow: 0 4px 0 #7d0f6e; font-variant-numeric: tabular-nums; }
  #expr .cn { font: inherit; font-size: 1em; font-weight: bold; color: var(--ink); background: #fff; border: 3px dashed #e3c6f0; border-radius: 14px;
    padding: 0 8px; margin: 0 2px; cursor: pointer; line-height: 1.3; }
  #expr .cn.pick { background: #ffe3f1; border: 3px solid #d6336c; animation: glow 1s infinite; }
  #expr .cn.hint { border: 3px solid #f08c00; animation: glow 1s infinite; }
  #expr .cn:disabled { cursor: default; border-color: transparent; }
  #expr .cop { color: var(--navy); margin: 0 4px; }
  .btn.fire { background: linear-gradient(120deg, #d6336c, #b5179e); font-size: 20px; }
  .btn.fire:disabled { opacity: .45; }
  .btn.nopar { background: #5c7cfa; }
  .btn.craft { background: #b5179e; }


  /* ---- メニュー：夏祭りの夜 ---- */
  .hero { position: relative; overflow: hidden; display: block; padding: 74px 16px 30px; border-radius: 22px; margin-bottom: 14px;
    background: radial-gradient(1.5px 1.5px at 8% 40%, #fff 99%, transparent), radial-gradient(1px 1px at 24% 33%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 44% 44%, #fff 99%, transparent), radial-gradient(1px 1px at 79% 36%, #fff 99%, transparent),
      radial-gradient(1px 1px at 93% 46%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 60% 30%, #fff 99%, transparent),
      linear-gradient(#11163d, #262c6b 62%, #4a3a7e); box-shadow: 0 5px 0 #0b0e24; color: #fff; }
  .hero .hrow { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
  .hero h1 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "BIZ UDPMincho", serif; font-weight: 800;
    font-size: clamp(26px, 6vw, 40px); letter-spacing: .08em; text-shadow: 0 0 18px rgba(255,190,90,.45), 0 2px 0 #0b0e24; }
  .hero h1 small { font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif; font-weight: bold; font-size: 13px; letter-spacing: .1em; color: #ffd8a8; opacity: 1; margin-bottom: 2px; }
  .garland { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; justify-content: space-between; padding: 0 3%; }
  .garland::before { content: ""; position: absolute; left: -2%; right: -2%; top: -26px; height: 40px; border-bottom: 2px solid #0b0e24; border-radius: 0 0 50% 50%; }
  .chochin { position: relative; display: block; width: 22px; height: 28px; margin-top: calc(var(--d) + 12px); border-radius: 48% / 40%;
    background: repeating-linear-gradient(transparent 0 5px, rgba(110,20,10,.28) 5px 6px), radial-gradient(ellipse at 50% 45%, #fff3cf 0 15%, #ffa94d 45%, #e2452b 82%);
    box-shadow: 0 0 14px 3px rgba(255,140,60,.5); }
  .chochin::before, .chochin::after { content: ""; position: absolute; left: 5px; right: 5px; height: 4px; background: #1c1712; border-radius: 2px; }
  .chochin::before { top: -3px; } .chochin::after { bottom: -3px; }
  .chochin b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 12px "Hiragino Mincho ProN", "Yu Mincho", serif; color: #7a1a10; }
  @media (max-width: 560px) { .chochin:nth-child(even) { display: none; } }
  .hbursts { position: absolute; right: 30%; top: 30px; display: flex; gap: 0; opacity: .45; pointer-events: none; }
  .hbursts svg { width: 92px; height: 92px; } .hbursts svg + svg { width: 60px; height: 60px; margin-top: 46px; }
  @media (max-width: 560px) { .hero { padding-top: 66px; } .hbursts { right: 2%; top: 34px; } .hbursts svg { width: 70px; height: 70px; } .hbursts svg + svg { display: none; } }
  .hero .bank { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22px; }
  .hero .chip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
  .hero .chip.star { background: #fff; color: var(--goldd); border-color: #fff; }
  .hero .chip.rank { background: var(--gold); color: #5b3d00; border-color: var(--gold); }

  #ruleCard { background: #fff4dc; box-shadow: 0 4px 0 #f0dcb4; }
  .rules span { background: #fff; border-left: 6px solid #e2452b; border-radius: 6px 12px 12px 6px; }
  .rules b { color: #e2452b; }

  /* モードえらび＝屋台 */
  .modes { gap: 14px; margin-top: 4px; }
  .mode { padding-top: 30px; background: #fffaf0; border-radius: 6px 6px 16px 16px; overflow: visible; }
  .mode::before { content: ""; position: absolute; left: -7px; right: -7px; top: -6px; height: 22px; border-radius: 6px 6px 2px 2px;
    background: repeating-linear-gradient(90deg, var(--c) 0 14px, #fff 14px 28px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .mode::after { content: ""; position: absolute; left: -7px; right: -7px; top: 15px; height: 8px;
    background: radial-gradient(circle at 7px 0, var(--c) 6.5px, transparent 7px) 0 0 / 14px 8px repeat-x; }
  .mode .cnt { z-index: 2; top: -14px; }
  .mode.on { background: #fff3d6; color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent), 0 8px 18px color-mix(in srgb, var(--c) 35%, transparent); }
  .mode.on .ms { color: var(--sub); }
  .mode[data-m="adv"] { color: #ffd43b; border-color: #2a2f6e;
    background: radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent), radial-gradient(1px 1px at 75% 22%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 60% 55%, #fff 99%, transparent), linear-gradient(#141936, #2c3570); }
  .mode[data-m="adv"] .ms { color: #c9cff5; }
  .mode[data-m="adv"].on { box-shadow: 0 0 0 3px rgba(255,212,59,.45), 0 8px 18px rgba(138,92,240,.45); }
  .mode[data-m="adv"].locked { filter: none; opacity: 1; color: #b8b4c8; }
  .mode[data-m="adv"].locked::before { background: repeating-linear-gradient(90deg, #6b6880 0 14px, #d9d6e3 14px 28px); }
  .mode[data-m="adv"].locked::after { background: radial-gradient(circle at 7px 0, #6b6880 6.5px, transparent 7px) 0 0 / 14px 8px repeat-x; }
  .lvc { border-color: #eadbc0; background: #fffdf7; box-shadow: 0 4px 0 #eadbc0; }
  .lvc.cur { background: color-mix(in srgb, var(--mc) 7%, #fffdf7); }

  /* ---- 導火線 ---- */
  #expr .fz { position: absolute; pointer-events: none; padding: 0; border-radius: 0; }
  #expr svg.fuse { left: 0; top: 0; width: 100%; overflow: visible; z-index: 0; }
  #expr .flame { font-size: 22px; line-height: 1; transform: translate(-50%, -85%); font-style: normal; z-index: 2; animation: flick .35s infinite alternate; transition: left .2s; }
  #expr .spk { left: 0; top: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; z-index: 3;
    box-shadow: 0 0 6px 3px #ffd43b, 0 0 16px 7px rgba(255,146,43,.8); }
  #expr .ember { width: 5px; height: 5px; margin: -2px 0 0 -2px; border-radius: 50%; background: #ffb74d; box-shadow: 0 0 4px #ff922b; animation: ember .65s forwards; z-index: 1; }
  #expr .op.lit, #expr .cop.lit { box-shadow: 0 0 0 4px rgba(255,146,43,.45), 0 4px 0 #f2a900; }
  #expr .cop.lit { border-radius: 8px; background: #ffe066; }
  #expr .fuse .hk { animation: hk 1s infinite; }
  @keyframes flick { from { transform: translate(-50%, -85%) scale(1) rotate(-4deg); } to { transform: translate(-50%, -90%) scale(1.12) rotate(4deg); } }
  @keyframes ember { 0% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px) scale(.4); background: #555; } }
  @keyframes hk { 0%,100% { fill: #c0392b; r: 5; } 50% { fill: #ffd43b; r: 8; } }
  #expr { padding-bottom: 26px; }

  /* ---- 花火大会：工房・アルバム・本番の夜空 ---- */
  .goal.shop .gi { font-size: 44px; line-height: 58px; text-align: center; }
  .goal .gt .tama, .shud .tama { display: block; margin-top: 2px; font-size: 13px; color: #b5179e; font-weight: bold; }
  .tama span { color: #e9d5ef; font-size: 15px; } .tama span.on { color: #ff5fa2; text-shadow: 0 0 4px #ffb3d1; }
  .goal .gt b.tw { display: inline; font-size: inherit; color: #b5179e; }
  .night { background: radial-gradient(circle at 50% 40%, #2c3570, #141936); border-radius: 16px; }
  .goal .gi.night { padding: 2px; }
  .ovart.night { border-radius: 50%; }
  .rart.night { border-radius: 50%; padding: 6px; }
  .rart.night.small { width: 80px; height: 80px; }
  .node svg { width: 100%; height: 100%; }
  .node.done:not(.boss) { padding: 5px; }
  .node.boss { background: #1b2150; }
  .node.boss:disabled { background: #e9e5f2; }
  .album { background: #141936; border-radius: 20px; padding: 10px 12px 12px; margin: 4px 0 10px; color: #fff; }
  .album .ahead { font-weight: bold; font-size: 17px; margin-bottom: 8px; }
  .album .ahead b { color: var(--gold); margin-left: 6px; }
  .agrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  @media (max-width: 640px) { .agrid { grid-template-columns: repeat(4, 1fr); } }
  .ak { background: #1f2654; border-radius: 12px; padding: 4px 2px 3px; text-align: center; }
  .ak.fin { box-shadow: inset 0 0 0 2px #f5c542; }
  .ak svg { width: 100%; height: auto; aspect-ratio: 1; }
  .ak span { display: block; font-size: 11px; color: #c9cff5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shud .tama { margin: 0; }
  .sky { overflow: hidden; border-radius: 12px; margin: 8px 0 0;
    background: radial-gradient(1.5px 1.5px at 12% 22%, #fff 99%, transparent), radial-gradient(1px 1px at 33% 12%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 58% 30%, #fff 99%, transparent), radial-gradient(1px 1px at 76% 16%, #fff 99%, transparent),
      radial-gradient(1px 1px at 90% 40%, #fff 99%, transparent), radial-gradient(1px 1px at 45% 45%, #fff 99%, transparent),
      linear-gradient(#0e1235, #232b66 70%, #34306a); }
  .sky .moon { position: absolute; right: 22px; top: 12px; width: 26px; height: 26px; border-radius: 50%; box-shadow: -7px 4px 0 0 #fff3bf; }
  .sky .crowd { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; }
  .sky .crowd svg { width: 100%; height: 100%; }
  .sky .crowd.cheer .pp { animation: jump .45s 2; }
  .sky .dmg { color: #ffd43b; text-shadow: 0 2px 0 #1b2150, 0 0 10px rgba(255,212,59,.6); }
  .sky .dmg.star { color: #ff8cc6; font-size: 34px; }
  @keyframes jump { 50% { transform: translateY(-6px); } }
  .hearts span { display: inline-block; }
  .hearts .lost { filter: grayscale(1); opacity: .3; }
  .sky .dmg { left: 0; right: 0; top: 28%; text-align: center; }
  .tamab { background: #b5179e; color: #fff; border: 2px solid #ff8cc6; border-radius: 999px; font-size: 14px; font-weight: bold; padding: 3px 10px; cursor: pointer; animation: pulse 1.2s infinite; }

  /* ---- ポップアップ ---- */
  .ov { position: fixed; inset: 0; background: rgba(30,25,45,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .ov.show { display: flex; }
  .ovc { background: #fff; border-radius: 26px; padding: 20px 18px; max-width: 420px; width: 100%; text-align: center; animation: pop .35s; box-shadow: 0 6px 0 #d9cbff; }
  .ovart { width: 120px; height: 120px; margin: 0 auto; font-size: 90px; line-height: 120px; }
  .ovc h2 { margin: 6px 0 2px; font-size: 26px; color: var(--purple); }
  .ovc .ovsub { color: var(--sub); font-size: 15px; }
  .ovc p { font-size: 18px; line-height: 1.6; margin: 10px 0 0; }
  .ovc .done { color: var(--green); font-size: 14px; }

  /* ---- 紙ふぶき ---- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
  #fx i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.2s ease-in forwards; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(240,140,0,.6)} 50%{box-shadow:0 0 0 8px rgba(240,140,0,0)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @keyframes npulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--c) 25%, transparent); } }
  @keyframes pop { 0%{transform:scale(.3)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes starIn { 0%{transform:scale(0) rotate(-90deg);opacity:0} 70%{transform:scale(1.35) rotate(10deg);opacity:1} 100%{transform:scale(1)} }
  @keyframes stamp { 0%{transform:scale(2.4) rotate(-8deg);opacity:0} 100%{transform:scale(1) rotate(-8deg);opacity:1} }
  @keyframes hop { 0%{transform:translate(-50%,-50px);opacity:0} 55%{transform:translate(-50%,4px);opacity:1} 75%{transform:translate(-50%,-8px)} 100%{transform:translate(-50%,0)} }
  @keyframes wob { from{transform:rotate(-8deg)} to{transform:rotate(8deg)} }
  @keyframes float { 50%{transform:translateY(-6px)} }
  @keyframes hit { 0%{filter:brightness(2.5)} 30%{transform:translateX(-12px) rotate(-6deg)} 60%{transform:translateX(9px) rotate(5deg)} 100%{filter:none;transform:none} }
  @keyframes critflash { 0%,40%{filter:brightness(2.2)} 100%{filter:none} }
  @keyframes atk { 40%{transform:scale(1.35) translateY(16px)} 100%{transform:none} }
  @keyframes down { 0%{transform:none;opacity:1;filter:brightness(2)} 30%{transform:rotate(-12deg)} 100%{transform:translateY(30px) scale(.15) rotate(200deg);opacity:0} }
  @keyframes dmg { 0%{opacity:0;transform:translateY(14px) scale(.6)} 20%{opacity:1;transform:translateY(0) scale(1.15)} 100%{opacity:0;transform:translateY(-26px)} }
  @keyframes heartOut { 0%{transform:scale(1.6);color:#fff} 100%{transform:scale(1)} }
  @keyframes flashB { 0%{background:#3a3550} 100%{} }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="garland" aria-hidden="true"><i class="chochin" style="--d:0px"></i><i class="chochin" style="--d:8px"></i><i class="chochin" style="--d:14px"><b>祭</b></i><i class="chochin" style="--d:18px"></i><i class="chochin" style="--d:21px"></i><i class="chochin" style="--d:22px"><b>祭</b></i><i class="chochin" style="--d:21px"></i><i class="chochin" style="--d:18px"></i><i class="chochin" style="--d:14px"><b>祭</b></i><i class="chochin" style="--d:8px"></i><i class="chochin" style="--d:0px"></i></div>

/* ================= 式の読み取り ================= */
function normalize(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/＋/g, "+").replace(/[－−ー‐―‑]/g, "-")

    else if ("+-*/".includes(c)) { out.push({ t: "op", v: c }); i++; }

}
function toStr(t) {

}
function toAscii(t) {

}
function stripLoneParens(t) {

  while (changed) {
    changed = false;
    for (let i = 0; i + 2 < t.length; i++) {
      if (t[i].t === "(" && t[i + 1].t === "num" && t[i + 2].t === ")") {
        t = t.slice(0, i).concat([t[i + 1]], t.slice(i + 3)); changed = true; break;
      }
    }
  }
  if (t.length >= 2 && t[0].t === "(" && t[t.length - 1].t === ")") {

    let d = 0, whole = true;
    for (let i = 0; i < t.length; i++) { if (t[i].t === "(") d++; if (t[i].t === ")") d--; if (d === 0 && i < t.length - 1) { whole = false; break; } }
    if (whole) return stripLoneParens(t.slice(1, -1));
  }
  return t;
}

/* ================= 計算の順じょのきまり ================= */
// いちばん内側の（ ）の中。（ ）がなければ式全体
function regions(t) {
  const r = []; let open = -1;
  for (let i = 0; i < t.length; i++) {
    if (t[i].t === "(") open = i;
    else if (t[i].t === ")") { if (open >= 0) r.push([open + 1, i]); open = -1; }
  }
  return r.length ? { list: r, paren: true } : { list: [[0, t.length]], paren: false };
}
function validInRegion(t, s, e) {
  const ops = [];
  for (let i = s; i < e; i++) if (t[i].t === "op") ops.push(i);
  if (!ops.length) return [];
  if (ops.some(i => isMD(t[i].v))) {
    // ×÷のまとまりごとに、いちばん左の×÷
    return ops.filter(i => isMD(t[i].v) && !(i - 2 >= s && t[i - 2].t === "op" && isMD(t[i - 2].v)));
  }

}
function validOps(t) {
  const R = regions(t); let v = [];
  for (const [s, e] of R.list) v = v.concat(validInRegion(t, s, e));
  return v;
}
function checkStep(t, k) {
  if (validOps(t).includes(k)) return { ok: true };
  const R = regions(t);
  const reg = R.list.find(([s, e]) => k >= s && k < e);
  if (R.paren && !reg) return { ok: false, rule: 1, msg: "（ ）の中を先に計算しよう。" };
  const [s, e] = reg;
  let hasMD = false;
  for (let i = s; i < e; i++) if (t[i].t === "op" && isMD(t[i].v)) hasMD = true;
  if (hasMD && !isMD(t[k].v)) return { ok: false, rule: 2, msg: "×や÷は、＋や−より先に計算しよう。" };
  return { ok: false, rule: 3, msg: "同じなかまの記号は、左から順に計算しよう。" };
}
function calc(a, op, b) {
  if (op === "+") return a + b;
  if (op === "-") return a - b;
  if (op === "*") return a * b;
  if (op === "/") return (b !== 0 && a % b === 0) ? a / b : null;
}

  const nt = stripLoneParens(t.slice(0, k - 1).map(plain).concat([{ t: "num", v: r, fresh: true }], t.slice(k + 2).map(plain)));
  return { tokens: nt, a, b, r };
}

/* ================= 問題をつくる ================= */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function bigNum(L) {
  const x = Math.random();
  if (L.id === 1 || L.base === 1) {
    if (x < 0.35) return rnd(11, 99);
    if (x < 0.75) return rnd(10, 99) * 10;
    if (x < 0.9) return rnd(2, 9) * 100;
    return 1000;
  }
  if (x < 0.6) return rnd(11, 99);
  if (x < 0.9) return rnd(10, 50) * 10;
  return rnd(2, 9) * 100;
}
// 計算を最後まで進めて、とちゅうの数を確かめる
function trace(t) {
  t = t.map(x => Object.assign({}, x));
  const order = [];
  while (t.length > 1) {
    const v = validOps(t);
    if (!v.length) return null;
    const k = v[0];
    const r = calc(t[k - 1].v, t[k].v, t[k + 1].v);
    if (r === null || r <= 0 || r > 2000 || !Number.isInteger(r)) return null;
    if (t[k].v === "/" && r < 2) return null; // ÷で答えが1になる式はさける
    order.push(t[k].id);
    t = stripLoneParens(t.slice(0, k - 1).concat([{ t: "num", v: r }], t.slice(k + 2)));
  }
  return { order, ans: t[0].v };
}
function genOnce(L, wantInteresting, wantMeaning, forceParen) {
  const n = L.n, ops = [];
  for (let i = 0; i < n; i++) ops.push(pick(L.ops.split("")));
  if (L.needMD && !ops.some(isMD)) return null;
  if (L.needAS && !ops.some(o => !isMD(o))) return null;
  let span = null;
  if (forceParen === undefined ? Math.random() < L.paren : forceParen) {
    const spans = [];
    for (let a = 0; a < n; a++) for (let b = a + 1; b <= n; b++) if (!(a === 0 && b === n)) spans.push([a, b]);
    span = pick(spans);
  }
  const nums = [];
  for (let i = 0; i <= n; i++) {
    const md = (i > 0 && isMD(ops[i - 1])) || (i < n && isMD(ops[i]));
    nums.push(md ? (Math.random() < 0.65 ? rnd(2, 9) : rnd(11, 30)) : bigNum(L));
  }
  // わる数が数字1つなら、わられる数をわり切れる数にする（右から）
  for (let i = n - 1; i >= 0; i--) {
    if (ops[i] === "/" && !(span && span[0] === i + 1) && !(span && span[1] === i)) {
      nums[i] = nums[i + 1] * rnd(2, 12);
    }
  }
  const t = [];
  for (let i = 0; i <= n; i++) {
    if (span && span[0] === i) t.push({ t: "(" });
    t.push({ t: "num", v: nums[i] });
    if (span && span[1] === i) t.push({ t: ")" });
    if (i < n) t.push({ t: "op", v: ops[i], id: i });
  }
  const tr = trace(t);
  if (!tr || tr.ans === 0) return null;
  if (L.mode === "calc" && !calcOK(t)) return null; // どのステップも筆算できる大きさか
  // 「×1」「÷1」「0」などがないか
  const naive = [...Array(n).keys()].join(",");
  const ord = tr.order.join(",");
  let interesting = ord !== naive, meaning = false;
  // ＋−だけで（ ）なし：最初が「−」の式だけが、左から計算しないと答えが変わる（例 560−320＋110）
  if (!span && !ops.some(isMD) && ops[0] === "-") interesting = true;
  if (span) {
    const np = trace(t.filter(x => x.t === "num" || x.t === "op"));
    if (!np || np.order.join(",") !== ord) { interesting = true; meaning = true; }
  }
  if (wantMeaning && !meaning) return null; // （ ）がないと順じょが変わる式
  if (wantInteresting && !interesting) return null;
  return toAscii(t);
}
function generate(L, forceParen) {
  const want = Math.random() >= L.boring;
  const mean = Math.random() < (L.meaningful || 0);
  for (let k = 0; k < 20000; k++) { const p = genOnce(L, want, mean, forceParen); if (p) return p; }
  return null;
}


/* ================= ★とクリアのきまり ================= */

};

function buildSet(pickL, per) {

  for (let g = 0; out.length < per && g < 300; g++) {
    const L = pickL(out.length);
    const p = L.mixParen ? generate(L, out.length % 2 === 0) : generate(L);
    if (p && !seen.has(p)) { seen.add(p); out.push(p); }
  }
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }

/* ================= 計算モード（筆算） ================= */
// 位はすべて「一の位＝0、十の位＝1…」の番号であつかう
const digs = n => String(n).split("").map(Number);
const PLACE = ["一", "十", "百", "千", "一万", "十万"];
const pn = p => PLACE[p] + "の位";
const atP = (arr, p) => (p >= 0 && p < arr.length) ? arr[arr.length - 1 - p] : null;
const rowOf = (W, fn) => [...Array(W)].map((_, c) => fn(W - 1 - c));

// かけ算の筆算：けたの多い数を上に。下の数は2けたまで（一の位が0の2けたはあつかわない）
function mulLayout(a, b) {
  const la = String(a).length, lb = String(b).length;
  let top = a, bot = b, sw = false;
  if (lb > la || (la === lb && b % 10 === 0 && a % 10 !== 0)) { top = b; bot = a; sw = true; }
  if (String(bot).length > 2 || String(top).length > 3) return null;
  if (bot >= 10 && bot % 10 === 0) return null;
  return { top, bot, sw };
}
function hissanOK(a, op, b) {
  if (op === "*") return !!mulLayout(a, b);
  if (op === "/") return b < 100 && a < 10000;
  return a < 100000 && b < 100000;
}
function calcOK(t) {
  t = t.map(x => Object.assign({}, x));
  while (t.length > 1) {
    const k = validOps(t)[0];
    const a = t[k - 1].v, op = t[k].v, b = t[k + 1].v;
    if (!hissanOK(a, op, b)) return false;
    t = stripLoneParens(t.slice(0, k - 1).concat([{ t: "num", v: calc(a, op, b) }], t.slice(k + 2)));
  }
  return true;
}
// 九九ですぐ出せる計算は、はじめは「あんざん」で答える
const isEasy = (a, op, b) => op === "*" ? (a < 10 && b < 10) : op === "/" ? (b < 10 && a / b < 10) : false;

/* ---- たし算（10をこえたら、くり上がりの1を先に書いてから、その位の答えを書く） ---- */

  const cin = [0];
  for (let p = 0; p < W; p++) cin[p + 1] = ((atP(A, p) || 0) + (atP(B, p) || 0) + cin[p]) >= 10 ? 1 : 0;
  const colSum = p => (atP(A, p) || 0) + (atP(B, p) || 0) + cin[p];
  const tasks = [];
  for (let p = 0; p < W; p++) {
    if (teinei && cin[p + 1]) tasks.push({ t: "carry", p: p + 1, col: p, v: 1 }); // くり上がりを先に
    tasks.push({ t: "ans", p, col: p, v: atP(S, p) });
  }
  const ans = {}, carry = {};
  let ti = 0;
  const H = {
    task: () => tasks[ti], sid: () => ti, teineiUsed: true,
    grid() {
      const tk = tasks[ti], fp = tk ? tk.col : -1;
      const f = p => p === fp ? "focus" : "";
      return { W, rows: [
        { memo: true, cells: rowOf(W, p => ({ v: carry[p] ? "1" : "", cls: tk && tk.t === "carry" && tk.p === p ? "cur" : "" })) },
        { cells: rowOf(W, p => ({ v: atP(A, p), cls: f(p) })) },
        { lab: "＋", line: true, cells: rowOf(W, p => ({ v: atP(B, p), cls: f(p) })) },
        { cells: rowOf(W, p => ({ v: ans[p], cls: tk && tk.t === "ans" && tk.p === p ? "cur" : (ans[p] !== undefined ? "in" : f(p)) })) }
      ] };
    },
    input(d) {
      const tk = tasks[ti];
      if (d !== tk.v) {
        if (tk.t === "carry") {
          const s = colSum(tk.col);
          if (d === s % 10) return { ok: false, msg: `${s} は 10 をこえたね。先に くり上がりの 1 を、${pn(tk.p)}の上に 小さく書こう。` };
          return { ok: false, msg: "くり上がりは 1 だよ。小さく 1 を書こう。" };
        }
        if (cin[tk.p] && d === (tk.v + 9) % 10) return { ok: false, msg: `${pn(tk.p - 1)}から くり上がった 1 を、たしわすれていないかな？` };
        return { ok: false, msg: `${pn(tk.p)}を もう一度 計算してみよう。` };
      }
      let msg = "";
      if (tk.t === "carry") { carry[tk.p] = 1; msg = `つぎに、${pn(tk.col)}の 答えを書こう。`; }
      else {
        ans[tk.p] = d;
        if (cin[tk.p + 1] && !teinei) { carry[tk.p + 1] = 1; msg = `10 をこえたので、${pn(tk.p + 1)}に 1 くり上げたよ。`; }
      }
      ti++;
      return { ok: true, msg, done: ti >= tasks.length };
    },
    hint() {
      const tk = tasks[ti], p = tk.col;
      const xs = [atP(A, p), atP(B, p)].filter(x => x !== null), s = colSum(p);
      const shiki = `${pn(p)}：${xs.join("＋")}${cin[p] ? "＋1（くり上がり）" : ""}＝${s}。`;
      if (tk.t === "carry") return shiki + `10 をこえたので、先に くり上がりの 1 を ${pn(tk.p)}の上に 小さく書こう。`;
      if (!xs.length) return `くり上がりの 1 を、そのまま ${pn(p)}に書こう。`;
      if (xs.length === 1 && !cin[p]) return `${pn(p)}は たす数がないので、${s} をそのまま書こう。`;
      return shiki + (s >= 10 ? `答えには ${s % 10} を書くよ。` : `${s} を書こう。`);
    }
  };

}

/* ---- ひき算（くり下がりは「上の数字をタップして10かりる」） ---- */

    grid() {

      const hl = H.hintOn && borrowing ? lender() : -1;

        { memo: true, cells: rowOf(W, q => ({ v: lent[q] ? String(cur[q]) : (recv[q] ? "10" : "") })) },
        { cells: rowOf(W, q => ({ v: orig(q), top: q,
            cls: [lent[q] ? "strike" : f(q), borrowing ? "tap" : "", q === hl ? "hintc" : ""].join(" ") })) },
        { lab: "−", line: true, cells: rowOf(W, q => ({ v: atP(B, q), cls: f(q) })) },
        { cells: rowOf(W, q => ({ v: ans[q], cls: tk && tk.t === "ans" && tk.p === q ? "cur" : (ans[q] !== undefined ? "in" : f(q)) })) }
      ] };

      const q = lender();

/* ---- かけ算（1つのかけ算ごとに「くり上がり → その位の答え」と書いてから、つぎの位へ） ---- */

  function rowTasks(t, mul, shift) {

    let cin = 0;
    for (let q = 0; q < FD.length; q++) {
      const x = atP(A1, q), y = atP(A2, q - 1), s = (x || 0) + (y || 0) + cin;
      if (teinei && s >= 10) tasks.push({ t: "sum", k: "memo", p: q, mp: q + 1, v: 1, x, y, cin, s });

    grid() {
      const tk = tasks[ti];
      const tdP = tk && tk.t !== "sum" ? tk.tp : -1;
      const mP = tk ? (tk.t === "p1" ? 0 : tk.t === "p2" ? 1 : -1) : -1;

        { memo: true, cells: rowOf(W, q => ({ v: memo[q], cls: isMemo && tk.t !== "sum" && tk.mp === q ? "cur" : "" })) },
        { cells: rowOf(W, q => ({ v: atP(T, q), cls: q === tdP ? "focus" : "" })) },
        { lab: "×", line: true, cells: rowOf(W, q => ({ v: atP(M, q), cls: q === mP ? "focus" : "" })) },

        { line: true, cells: rowOf(W, cell("p2")) },
        { memo: true, cells: rowOf(W, q => ({ v: smemo[q], cls: isMemo && tk.t === "sum" && tk.mp === q ? "cur" : "" })) },

    input(d) {

          return { ok: false, msg: `${tk.td}×${tk.mul}${tk.cin ? `＋${tk.cin}` : ""} を もう一度 計算しよう。` };
        }

        if (tk.t !== "sum" && tk.k === "dig" && tk.cin && d === (tk.td * tk.mul) % 10) return { ok: false, msg: `くり上がりの ${tk.cin} を たしわすれていないかな？` };
        if (tk.t === "sum" && tk.cin && d === (tk.v + 9) % 10) return { ok: false, msg: "くり上がりの 1 を たしわすれていないかな？" };

      if (tk.k === "memo") (tk.t === "sum" ? smemo : memo)[tk.mp] = d;

    hint() {

        if (xs.length === 1 && !tk.cin) return `${pn(tk.p)}は ${xs[0]} をそのまま書こう。`;
        if (!xs.length) return `くり上がりの 1 を そのまま書こう。`;

    }

/* ---- わり算（たてる → かける → ひく → おろす） ---- */
function hsDiv(a, b) {

    if (q > 0) {
      const pr = q * b, df = cv - pr, pRow = wr++, dRow = wr++, pd = digs(pr);
      pd.forEach((v, j) => tasks.push({ t: "prod", row: pRow, col: i - (pd.length - 1 - j), v, q, cur: cv, pr }));
      if (df > 0 || i === n - 1) {
        const dd = digs(df);
        dd.forEach((v, j) => tasks.push({ t: "diff", row: dRow, col: i - (dd.length - 1 - j), v, cur: cv, pr }));
      } else tasks.push({ t: "diff0", row: dRow, col: i, v: 0, cur: cv, pr });

    task: () => tasks[ti], sid: () => ti,
    phase() { const tk = tasks[ti]; return tk ? { q: 0, prod: 1, diff: 2, diff0: 2, down: 3 }[tk.t] : -1; },
    grid() {

      const isF = (r, c) => fc && r === tk.row && c >= fc[0] && c <= fc[1];
      const rows = [
        { cells: D.map((_, c) => ({ v: qd[c], cls: tk && tk.t === "q" && tk.col === c ? "cur" : (qd[c] !== undefined ? "in" : "") })) },
        { lab: `<span>${b}</span><span class="brk">)</span>`, labCls: "divlab", bar: true, cells: D.map((v, c) => ({ v, cls: isF(-1, c) ? "focus" : "" })) }

        if (tk.t === "q") {
          if (d * b > tk.cur) return { ok: false, msg: `${b}×${d}＝${b * d} は ${tk.cur} より大きいね。もっと小さい数を たてよう。` };
          return { ok: false, msg: `${tk.cur}−${b * d}＝${tk.cur - b * d} で、わる数の ${b} より大きくなるね。もっと大きい数を たてよう。` };
        }
        if (tk.t === "prod") return { ok: false, msg: `${tk.q}×${b} を もう一度 計算しよう。` };
        return { ok: false, msg: `${tk.cur}−${tk.pr} を もう一度 計算しよう。` };
      }

      else { (work[tk.row] = work[tk.row] || {})[tk.col] = { v: d, cls: tk.t === "diff0" ? "zero" : "in" }; }

        const dn = tasks[ti], rw = (work[dn.row] = work[dn.row] || {});

    hint() {
      const tk = tasks[ti];

        if (tk.v === 0) return head + `${tk.cur} の中に ${b} は ないね。商に 0 をたてよう。`;
        return head + `${tk.cur} の中に ${b} は いくつ？ ${b}×□ が ${tk.cur} をこえない、いちばん大きい数を見つけよう。`;
      }
      if (tk.t === "prod") return `たてた ${tk.q} と、わる数の ${b} をかけよう。${tk.q}×${b}＝？`;

    }

}

/* ---- 計算パネル ---- */

// 花火の種類ごとの絵（sil＝まだ もっていない）
function burstSVG(kind, color, sil) {
  const C = sil ? "#8d8798" : color, G = sil ? "#6f6a7a" : "#ffd43b", W = sil ? "#6f6a7a" : "#fff";
  const cx = 30, cy = 28, f = v => v.toFixed(1);
  const at = (r, a, x = cx, y = cy) => [x + r * Math.cos(a), y + r * Math.sin(a)];
  const around = (n, fn, off = 0) => [...Array(n)].map((_, i) => fn(off + i * 2 * Math.PI / n, i)).join("");
  const dots = (n, r, rr, col, x, y, off) => around(n, a => { const [px, py] = at(r, a, x, y); return `<circle cx="${f(px)}" cy="${f(py)}" r="${rr}" fill="${col}"/>`; }, off);
  const rays = (n, r0, r1, col, w, x, y, off) => around(n, a => { const [x0, y0] = at(r0, a, x, y), [x1, y1] = at(r1, a, x, y);
    return `<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; }, off);
  const droop = (n, r, col, w, fall) => around(n, a => { const [x1, y1] = at(r, a);
    return `<path d="M${cx} ${cy} Q${f(x1)} ${f(y1 - 4)} ${f(x1 + (x1 - cx) * .15)} ${f(y1 + fall)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`; });
  let s = "";
  switch (kind) {
    case "botan": s = dots(12, 20, 3, C) + dots(8, 11, 2.4, G); break;
    case "kiku": s = rays(16, 6, 21, C, 2) + dots(16, 23, 1.8, W); break;
    case "yanagi": s = droop(12, 15, G, 1.6, 16) + `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${W}"/>`; break;
    case "yashi": s = droop(6, 20, C, 3.4, 8); break;
    case "senrin": s = [[18, 16], [42, 16], [30, 28], [18, 40], [42, 40]].map(([x, y]) => dots(7, 5, 1.6, C, x, y) + `<circle cx="${x}" cy="${y}" r="1.4" fill="${G}"/>`).join(""); break;
    case "hachi": s = around(8, a => { const p = [0, 1, 2, 3, 4].map(k => at(5 + k * 4, a + (k % 2 ? .25 : -.25))); return `<polyline points="${p.map(q => f(q[0]) + "," + f(q[1])).join(" ")}" stroke="${k2(C, G, a)}" stroke-width="1.8" fill="none"/>`; }); break;
    case "heart": s = [...Array(22)].map((_, i) => { const t = i / 22 * 2 * Math.PI, x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return `<circle cx="${f(cx + x * 1.15)}" cy="${f(cy + y * 1.15 - 2)}" r="2" fill="${C}"/>`; }).join(""); break;
    case "niko": s = dots(18, 20, 2, G) + `<circle cx="23" cy="23" r="2.6" fill="${C}"/><circle cx="37" cy="23" r="2.6" fill="${C}"/>` +
      [...Array(7)].map((_, i) => { const a = Math.PI * (.2 + i * .1); const [x, y] = at(10, a, cx, cy + 1); return `<circle cx="${f(x)}" cy="${f(y)}" r="1.8" fill="${C}"/>`; }).join(""); break;
    case "kamuro": s = droop(20, 19, G, 1.2, 10) + dots(20, 19, 1.4, G); break;
    case "ring": s = dots(10, 9, 2.4, C) + [...Array(16)].map((_, i) => { const a = i / 16 * 2 * Math.PI; return `<circle cx="${f(cx + 23 * Math.cos(a))}" cy="${f(cy + 8 * Math.sin(a) - 4 * Math.cos(a))}" r="1.6" fill="${G}"/>`; }).join(""); break;
    case "star": s = [...Array(5)].map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5, b = a + 4 * Math.PI / 5; const [x0, y0] = at(20, a), [x1, y1] = at(20, b);
      return [0, .25, .5, .75].map(t => `<circle cx="${f(x0 + (x1 - x0) * t)}" cy="${f(y0 + (y1 - y0) * t)}" r="2" fill="${C}"/>`).join(""); }).join(""); break;
    case "himawari": s = dots(14, 19, 4, G) + `<circle cx="${cx}" cy="${cy}" r="11" fill="${sil ? C : "#8a5a00"}"/>` + dots(7, 6, 1.4, C); break;
    case "niagara": s = `<line x1="6" y1="12" x2="54" y2="12" stroke="${W}" stroke-width="2"/>` +
      [...Array(9)].map((_, i) => `<line x1="${8 + i * 5.5}" y1="14" x2="${8 + i * 5.5}" y2="${42 + (i % 3) * 5}" stroke="${i % 2 ? G : C}" stroke-width="1.6" stroke-dasharray="3 2"/>`).join(""); break;
    case "starmine": s = dots(9, 8, 1.8, C, 17, 20) + dots(9, 8, 1.8, G, 43, 18) + dots(10, 10, 2, sil ? C : "#4dabf7", 30, 38) + dots(7, 6, 1.6, sil ? C : "#69db7c", 44, 42, .3); break;
    case "nishiki": s = droop(18, 20, G, 1.2, 9) + dots(10, 9, 2.4, C); break;
    case "sanshaku": s = dots(22, 25, 1.8, sil ? C : "#ff6b6b") + dots(16, 18, 2.1, G) + dots(12, 11, 2.3, C) + `<circle cx="${cx}" cy="${cy}" r="3" fill="${W}"/>`; break;
  }
  if (sil) s += `<text x="30" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">？</text>`;
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
function k2(a, b, ang) { return Math.round(ang * 4) % 2 ? a : b; }

const FIRE_COLS = [["#ff5fa2", "#ffd43b", "#fff"], ["#4dabf7", "#b197fc", "#fff"], ["#69db7c", "#ffd43b", "#fff"], ["#ff922b", "#ff6b6b", "#fff3bf"]];
function firework(x, y, size, cols) {
  const fx = $("fx"), n = Math.round(16 * size), dist = 70 * size;
  cols = cols || pick(FIRE_COLS);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .3, d = dist * (.75 + Math.random() * .35);
    const s = document.createElement("b");
    s.className = "spark";
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.background = s.style.color = cols[i % cols.length];

    s.style.setProperty("--dy", Math.sin(a) * d + 10 * size + "px");

}
function centerOf(el) {

}
// 要素の上で小さくはじける（正しい記号をタップしたとき）
function fireAt(el, size) { if (!el) return; const c = centerOf(el); firework(c.x, c.y - c.h * .2, size); }

/* ================= 導火線（計算の順じょ＝火が とどく順番） ================= */
// 式の下に導火線をえがく。🔥は「いま火が ある場所」。正しい記号をタップすると、火花が導火線を走って その記号に火が つく
function relRect(el, base) {
  const r = el.getBoundingClientRect(), b = base.getBoundingClientRect();
  return { l: r.left - b.left, t: r.top - b.top, w: r.width, h: r.height, cx: r.left - b.left + r.width / 2, b: r.bottom - b.top };
}
function drawFuse(ex, opEls, litEl, hintEls) {
  ex.querySelectorAll(".fz").forEach(e => e.remove());
  ex._fz = { opEls, litEl, hintEls: hintEls || [] };
  ex._fuseY = null;
  const items = [...ex.children].filter(e => !e.classList.contains("fz"));
  if (items.length < 3 || !opEls.length) return;
  const R = items.map(e => relRect(e, ex));
  if (!R[0].h) return;
  const mid = R[0].t + R[0].h / 2;
  if (R.some(r => Math.abs(r.t + r.h / 2 - mid) > R[0].h * .6)) return; // 2行に おりかえしたときは 出さない
  const y = Math.max(...R.map(r => r.b)) + 8;
  const x0 = R[0].l - 10, x1 = R[R.length - 1].l + R[R.length - 1].w + 6;
  const hs = new Set(ex._fz.hintEls);
  let knots = "";
  opEls.forEach(e => {
    const r = relRect(e, ex);
    knots += `<line x1="${r.cx}" y1="${y}" x2="${r.cx}" y2="${r.b - 2}" stroke="#8b5a2b" stroke-width="2"/>` +
      `<circle class="${hs.has(e) ? "hk" : ""}" cx="${r.cx}" cy="${y}" r="5" fill="#c0392b" stroke="#7a2318" stroke-width="1.5"/>`;
  });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "fz fuse");
  svg.setAttribute("height", y + 10);
  svg.innerHTML = `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>` +
    `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#d9a066" stroke-width="2" stroke-dasharray="4 4"/>` + knots;
  ex.appendChild(svg);
  const fl = document.createElement("i");
  fl.className = "fz flame"; fl.textContent = "🔥";
  fl.style.left = (litEl && litEl.isConnected ? relRect(litEl, ex).cx : x0) + "px";
  fl.style.top = y + "px";
  ex.appendChild(fl);
  ex._fuseY = y;
}
// 🔥から 記号まで 火花を走らせる。かかる時間（ミリ秒）を返す。演出だけなので、とちゅうで画面が かわっても 問題ない
function sparkRun(ex, toEl, onArrive) {
  const fl = ex.querySelector(".flame"), y = ex._fuseY;
  if (!fl || y === null || !toEl) { if (onArrive) onArrive(); return 0; }
  const ax = parseFloat(fl.style.left), to = relRect(toEl, ex), bx = to.cx, by = to.b - 6;
  const dist = Math.abs(bx - ax), d1 = Math.min(420, 160 + dist * 1.1), d2 = 120;
  fl.style.visibility = "hidden";
  const s = document.createElement("i"); s.className = "fz spk"; ex.appendChild(s);
  s.animate([{ transform: `translate(${ax}px,${y}px)` }, { transform: `translate(${bx}px,${y}px)`, offset: d1 / (d1 + d2) }, { transform: `translate(${bx}px,${by}px)` }],
    { duration: d1 + d2, fill: "forwards" });
  const n = Math.max(4, Math.round(dist / 12));
  for (let i = 0; i <= n; i++) setTimeout(() => {
    if (!ex.contains(s)) return;
    const e = document.createElement("i"); e.className = "fz ember";
    e.style.left = ax + (bx - ax) * i / n + "px"; e.style.top = y + "px";
    ex.appendChild(e); setTimeout(() => e.remove(), 650);
  }, d1 * i / n);
  setTimeout(() => {
    if (!ex.contains(s)) return;
    s.remove(); fl.style.left = bx + "px"; fl.style.top = y + "px"; fl.style.visibility = "";
    toEl.classList.add("lit");
    if (onArrive) onArrive();
  }, d1 + d2);
  return d1 + d2;
}
// まちがえた記号：火が とどかず、けむりだけ
function fuseFizzle(el) {

/* ================= 花火工房（（ ）をつけて、注文の数をつくる）＝ 花火大会の中にある ================= */
const CRAFT_PER = 5;
const CRAFT = [
  { id: 1, name: "レベル1", short: "＋ − ×・数3つ", ops: "+-*",  n: 2, none: 0,   tags: ["＋ − ×", "数は3つ", "（ ）が ひつよう"] },
  { id: 2, name: "レベル2", short: "÷も・数3つ",   ops: "+-*/", n: 2, none: .2,  tags: ["＋ − × ÷", "数は3つ", "（ ）が いらない問題も"] },
  { id: 3, name: "レベル3", short: "数4つ",        ops: "+-*/", n: 3, none: .2,  tags: ["＋ − × ÷", "数は4つ", "（ ）が いらない問題も"] }
];
let craftStars = load("junjo_craft", {});
const craftTotal = () => CRAFT.reduce((s, C) => s + (craftStars[C.id] || 0), 0);
let craftLv = 1, cf = null, craftSeq = 0;
const curC = () => CRAFT.find(C => C.id === craftLv);

function craftTokens(q, span) {
  const t = [];
  for (let i = 0; i <= q.n; i++) {
    if (span && span[0] === i) t.push({ t: "(" });
    t.push({ t: "num", v: q.nums[i] });
    if (span && span[1] === i) t.push({ t: ")" });
    if (i < q.n) t.push({ t: "op", v: q.ops[i], id: i });
  }
  return t;
}
function craftSpans(n) {
  const s = [];
  for (let a = 0; a < n; a++) for (let b = a + 1; b <= n; b++) if (!(a === 0 && b === n)) s.push([a, b]);
  return s;
}
function craftValue(q, span) {
  const tr = trace(craftTokens(q, span));
  return tr && tr.ans <= 500 ? tr.ans : null;
}
function genCraft(C, wantNone) {
  for (let k = 0; k < 20000; k++) {
    const n = C.n, ops = [];
    for (let i = 0; i < n; i++) ops.push(pick(C.ops.split("")));
    if (!ops.some(isMD) || !ops.some(o => !isMD(o))) continue; // （ ）で順じょが かわる式だけ
    const nums = [];
    for (let i = 0; i <= n; i++) {
      const md = (i > 0 && isMD(ops[i - 1])) || (i < n && isMD(ops[i]));
      nums.push(md ? rnd(2, 9) : rnd(2, C.id === 1 ? 20 : 30));
    }
    for (let i = n - 1; i >= 0; i--) if (ops[i] === "/") nums[i] = nums[i + 1] * rnd(2, 6);
    const q = { n, nums, ops };
    const base = craftValue(q, null);
    if (base === null) continue;
    const other = [...new Set(craftSpans(n).map(s => craftValue(q, s)).filter(v => v !== null && v !== base))];
    if (!other.length) continue;
    q.target = wantNone ? base : pick(other);
    q.none = q.target === base;
    return q;
  }
  return null;
}
function craftBuild(C) {
  const out = [], seen = new Set();
  const noneN = C.none ? 1 : 0;
  for (let g = 0; out.length < CRAFT_PER && g < 300; g++) {
    const q = genCraft(C, out.length < noneN);
    if (!q) continue;
    const key = q.nums.join(",") + q.ops.join("");
    if (!seen.has(key)) { seen.add(key); out.push(q); }
  }
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

    const b = add("button", "cn" + (cf.pick === i ? " pick" : "") + (cf.hintSpan && i >= cf.hintSpan[0] && i <= cf.hintSpan[1] ? " hint" : ""), q.nums[i]);
    b.disabled = cf.done || cf.busy;
    b.onclick = () => craftTapNum(i);
    if (cf.pair && cf.pair[1] === i) add("span", "par", "）");
    if (i < q.n) add("span", "cop", SYM[q.ops[i]]);
  }
  drawFuse(ex, [...ex.querySelectorAll(".cop")], null, []);

  const bx = $("btns"); bx.innerHTML = "";
  const mk = (cls, txt, fn, dis) => { const e = document.createElement("button"); e.className = "btn " + cls; e.textContent = txt; e.onclick = fn; e.disabled = !!dis; bx.appendChild(e); return e; };
  if (!cf.done) {
    mk("fire", "🎆 ためしうち！", () => craftLaunch(cf.pair), !cf.pair || cf.busy);
    mk("nopar", "（ ）なしで ためしうち", () => craftLaunch(null), cf.busy);
    if (cf.pair) mk("reset", "（ ）を はずす", () => { if (cf.busy) return; cf.pair = null; cf.pick = null; setMsg("", ""); craftRender(); });
    mk("hintb", "ヒント", craftHint, cf.busy);
  } else {
    mk("next big", cf.qi === cf.set.length - 1 ? "けっかを見る ▶" : "つぎの問題 ▶", craftNext);
  }
  craftRenderLog();
}
function craftRenderLog() {
  const lg = $("log");
  if (!cf.lines.length || cf.finished) { lg.innerHTML = '<div class="empty">うちあげると、ここに計算の順じょが残ります。</div>'; return; }
  lg.innerHTML = cf.lines.map((s, i) => `<div class="line"><span class="eq">${i ? "＝" : ""}</span><span>${s}</span></div>`).join("");
}

function craftTapNum(i) {
  if (cf.done || cf.busy) return;
  const q = cf.set[cf.qi];
  cf.hintSpan = null;
  if (cf.pick === null) {
    cf.pair = null; cf.pick = i;
    setMsg("info", "（ ）で かこむ、もう1つのはしの数を タップしよう。");
  } else if (cf.pick === i) {
    cf.pick = null; setMsg("", "");
  } else {
    const a = Math.min(cf.pick, i), b = Math.max(cf.pick, i);
    cf.pick = null;
    if (a === 0 && b === q.n) setMsg("info", "式ぜんぶを（ ）で かこんでも、順じょは かわらないよ。べつの場所を えらぼう。");
    else { cf.pair = [a, b]; setMsg("", ""); }
  }
  craftRender();
}

function craftLaunch(span) {
  if (cf.done || cf.busy) return;
  const q = cf.set[cf.qi], seq = craftSeq;
  cf.busy = true; cf.pick = null; cf.hintSpan = null;
  let t = stripLoneParens(craftTokens(q, span));
  const lines = [toStr(t)], order = [];
  let broke = null;
  while (t.length > 1) {
    const k = validOps(t)[0];
    order.push(t[k].id);
    const r = calc(t[k - 1].v, t[k].v, t[k + 1].v);
    if (r === null) { broke = "わり切れない ÷"; break; }
    if (r < 0) { broke = "マイナス"; break; }
    t = applyStep(t, k).tokens;
    lines.push(toStr(t));
  }
  cf.lines = [lines[0]];
  setMsg("info", "🎆 ためしうち…");
  craftRender();
  let i = 1;
  const stepT = setInterval(() => {
    if (seq !== craftSeq) { clearInterval(stepT); return; }
    if (i < lines.length) {
      const op = $("expr").querySelectorAll(".cop")[order[i - 1]];
      cf.lines.push(lines[i++]); craftRenderLog();
      sparkRun($("expr"), op, () => fireAt(op, .45)); // 計算の順じょどおりに 導火線を 火が走る
      sfx("ok");
      return;
    }
    clearInterval(stepT);
    craftJudge(span, broke ? null : t[0].v, broke);
  }, 600);
}
function craftJudge(span, val, broke) {
  const q = cf.set[cf.qi];
  if (val === q.target) {
    cf.done = true; cf.busy = false;
    cf.solved[cf.qi] = true;
    cf.perf[cf.qi] = cf.qMiss === 0 && !cf.qHint;
    const base = craftValue(q, null);
    let m = `ドーン！ ${q.target} の花火が あがった！`;
    if (!span) m = `そのとおり！（ ）が なくても ${q.target} になるね。`;
    else if (base === q.target) m = `せいこう！でも この（ ）は なくても 同じ答えに なるよ。`;
    setMsg("done", m + (cf.perf[cf.qi] ? " ノーミス！" : ""));
    craftRender();
    sfx(cf.perf[cf.qi] ? "perfect" : "solved");
    launchAt($("expr"), cf.perf[cf.qi] ? 1.8 : 1.3);
    setTimeout(() => launchAt($("expr"), 1, null), 300);
    return;
  }
  cf.busy = false; cf.miss++; cf.qMiss++;
  sfx("ng");
  const where = span ? "（ ）の場所を かえてみよう。" : "（ ）を つけてみよう。";
  setMsg("bad", broke
    ? `とちゅうで ${broke} になって、花火が あがらなかった…。${where}`
    : `${val} の花火に なっちゃった。目標は ${q.target}。${where}`);
  craftRender();
  const c = centerOf($("expr"));
  firework(c.x, c.y - 20, .5, ["#adb5bd", "#868e96"]);
}
function craftHint() {
  if (cf.done || cf.busy) return;
  const q = cf.set[cf.qi];
  cf.hints++; cf.qHint = true; cf.pick = null;
  if (q.none) {
    cf.hintSpan = null;
    setMsg("info", "ヒント：（ ）を つけないで、きまりどおりに計算すると いくつになるかな？");
  } else {
    cf.hintSpan = craftSpans(q.n).find(s => craftValue(q, s) === q.target);
    setMsg("info", "ヒント：光っている数を（ ）で かこんでみよう。");
  }
  craftRender();
}
function craftNext() {
  if (!cf.done) return;
  if (cf.qi < cf.set.length - 1) { cf.qi++; craftStartQ(); return; }
  cf.finished = true;
  const o = cf.miss + cf.hints, st = o === 0 ? 3 : o <= 2 ? 2 : 1, prev = craftStars[craftLv] || 0;
  if (st > prev) { craftStars[craftLv] = st; save("junjo_craft", craftStars); }
  // ★★いじょうで 特製玉を1つ（本番で 火種を1つ もどせる）
  const tama = st >= 2 && advData.tama < TAMA_MAX;
  if (tama) { advData.tama++; saveAdv(); }
  cf.res = { st, prev, tama };
  setMsg(st === 3 ? "done" : "", st === 3 ? "パーフェクト！ 注文 かんぺき！" : "");
  renderLevels();
  craftRender();
  if (st === 3) { sfx("fanfare"); confetti(50); }
  [0, 350, 700].forEach((d, i) => setTimeout(() => launchAt($("expr"), 1.4 - i * .2, FIRE_COLS[i]), d));
}
function craftRenderResult() {
  const r = cf.res, C = curC();
  let h = `<div class="result"><div class="rstars">${starHTML(r.st)}</div>`;
  h += `<div class="big">工房 ${C.name} 注文 ${r.st === 3 ? "かんぺき！" : "おつかれさま"}</div>`;
  h += `<div class="stats"><span>注文 ${cf.set.length}こ</span><span${cf.miss === 0 ? ' class="z"' : ""}>まちがい ${cf.miss}</span><span${cf.hints === 0 ? ' class="z"' : ""}>ヒント ${cf.hints}</span></div>`;
  if (r.st > r.prev && r.prev > 0) h += `<p><span class="newrec">さいこう記録 こうしん！</span></p>`;
  h += r.tama ? `<p><span class="newrec">✨ 特製玉を 1つ つくった！（${advData.tama}/${TAMA_MAX}）</span><br>本番で まちがえたとき、火種を 1つ もどせるよ。</p>`
    : r.st >= 2 ? `<p>特製玉は もう ${TAMA_MAX}こ もっているよ。本番で つかおう！</p>`
    : `<p>★★いじょうで 注文を こなすと、特製玉が もらえるよ。</p>`;
  $("expr").innerHTML = h + "</div>";
  const b = $("btns"); b.innerHTML = "";
  const mk = (cls, txt, fn) => { const e = document.createElement("button"); e.className = "btn " + cls; e.textContent = txt; e.onclick = fn; b.appendChild(e); };
  mk("again", "ちがう注文で もう一度", craftNewSet);
  const nx = CRAFT.find(x => x.id === craftLv + 1);
  if (nx) mk("next" + (r.st >= 2 ? " big" : ""), nx.name + " へ ▶", () => { craftLv = nx.id; craftNewSet(); window.scrollTo(0, 0); });
  mk("adv", "花火大会へ 🎆", () => setMode("adv"));
}

/* ================= 先生用：問題の追加 ================= */
function validate(str) {
  const t = tokenize(str);
  if (!t || !t.length) return { ok: false, err: "使えない文字があります。" };
  let d = 0, prev = null, ops = 0;
  for (const x of t) {
    const p = prev ? prev.t : null;
    if (x.t === "num" && !(p === null || p === "op" || p === "(")) return { ok: false, err: "式の形がおかしいところがあります。" };
    if (x.t === "op" && !(p === "num" || p === ")")) return { ok: false, err: "記号の前に数がありません。" };
    if (x.t === "(" && !(p === null || p === "op" || p === "(")) return { ok: false, err: "（ の前には記号が必要です。" };
    if (x.t === ")" && !(p === "num" || p === ")")) return { ok: false, err: "） の前に数がありません。" };
    if (x.t === "(") d++;
    if (x.t === ")") { d--; if (d < 0) return { ok: false, err: "（ ）の数が合いません。" }; }
    if (x.t === "op") ops++;
    prev = x;
  }
  if (d !== 0 || !(prev.t === "num" || prev.t === ")")) return { ok: false, err: "（ ）の数が合わないか、式が記号で終わっています。" };
  if (!ops) return { ok: false, err: "記号が1つ以上ある式を入れてください。" };
  let s = stripLoneParens(t);
  while (s.length > 1) {
    const k = validOps(s)[0];
    const r = calc(s[k - 1].v, s[k].v, s[k + 1].v);
    if (r === null) return { ok: false, err: "わり切れない÷があります。" };
    if (r < 0) return { ok: false, err: "とちゅうで答えがマイナスになります。" };
    s = stripLoneParens(s.slice(0, k - 1).concat([{ t: "num", v: r }], s.slice(k + 2)));
  }
  return { ok: true, norm: toAscii(t), ans: s[0].v };
}
function renderCustomList() {
  $("customList").textContent = custom.length ? "追加した問題：" + custom.map(p => toStr(tokenize(p))).join("　") : "";
}
$("addBtn").onclick = () => {
  const v = validate($("addInput").value);
  const m = $("addMsg");
  if (!v.ok) { m.style.color = "#b03030"; m.textContent = v.err; return; }
  if (custom.includes(v.norm)) { m.style.color = "#b03030"; m.textContent = "その問題はもう入っています。"; return; }
  custom.push(v.norm); save("junjo_custom", custom);
  m.style.color = "#1f7a43"; m.textContent = `追加しました（答え ${v.ans}）。「先生の問題」で出題されます。`;
  $("addInput").value = "";
  renderCustomList();
  if (lv === 0) newSet(); else renderLevels();
};
$("clearCustom").onclick = () => {
  if (!custom.length) return;
  if (!confirm("追加した問題をすべて消しますか？")) return;
  custom = []; save("junjo_custom", custom); renderCustomList();
  $("addMsg").textContent = "";
  if (lv === 0) newSet(); else renderLevels();
};
$("advFree").onchange = e => { advFree = e.target.checked; save("junjo_advfree", advFree); renderLevels(); };
$("resetStars").onclick = () => {
  if (!confirm("この端末の ★の記録を すべて消しますか？")) return;
  stars = {}; best = {}; save("junjo_stars", stars); save("junjo_best", best);
  craftStars = {}; save("junjo_craft", craftStars); renderLevels();
};
$("resetAdv").onclick = () => {
  if (!confirm("花火大会の進みぐあい（特製玉もふくむ）を はじめに もどしますか？")) return;
  advData = { pos: 0, st: {}, tama: 0 }; saveAdv(); renderLevels();
};

renderCustomList();
$("advFree").checked = advFree;
newSet();
// メニューの夜空：花火の絵と、ひらいたときの1発
document.querySelector(".hbursts").innerHTML = burstSVG("kiku", "#ff8cc6") + burstSVG("botan", "#8fd3ff");
setTimeout(() => { const r = document.querySelector(".hero").getBoundingClientRect(); firework(r.left + r.width * .62, r.top + r.height * .38, 1.1); }, 500);
</script>
